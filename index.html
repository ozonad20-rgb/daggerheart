a": [["Predador Apex", "Antes de atacar um adversário marcado, gaste 1 Esperança; em sucesso, o mestre perde 1 Ponto de Medo."]]}, "Treinador": {"atributo": "Agilidade", "fundamentais": [["Companheiro Animal", "Você tem um companheiro animal (a critério do mestre); use a ficha de companheiro. Ao subir de nível, escolha também um upgrade para ele."]], "especializacao": [["Treinamento Especializado", "Escolha um upgrade adicional para o companheiro."], ["Unidos na Batalha", "Quando um adversário CaC ao seu companheiro atacar você, receba +2 na Evasão contra esse ataque."]], "maestria": [["Treinamento Avançado", "Escolha dois upgrades adicionais para o companheiro."], ["Amigo Leal", "Uma vez por descanso longo, se um ataque faria você ou seu companheiro marcar o último PV/Fadiga e estiverem Próximos, ao ficarem CaC um pode sofrer o dano no lugar do outro."]]}}, "Serafim": {"Portador Divino": {"atributo": "Força", "fundamentais": [["Arma Espiritual", "Com arma CaC ou Muito Próximo equipada, ela voa da sua mão para atacar um alvo Próximo e retorna. Marque 1 PF para atingir um alvo adicional no alcance com o mesmo teste."], ["Toque Piedoso", "Uma vez por descanso longo, toque uma criatura para recuperar 2 PV ou 2 PF."]], "especializacao": [["Devoção", "Ao rolar Dados de Oração, role um dado extra e descarte o menor. Toque Piedoso pode ser usado duas vezes por descanso longo."]], "maestria": [["Ressonância Sagrada", "Ao rolar dano da Arma Espiritual, se dois ou mais dados empatarem, dobre o valor de cada dado empatado."]]}, "Sentinela Alada": {"atributo": "Força", "fundamentais": [["Asas de Luz", "Você pode voar; enquanto voando: marque 1 PF para carregar uma criatura voluntária do seu tamanho ou menor; ou gaste 1 Esperança para causar 1d8 de dano adicional num ataque bem-sucedido."]], "especializacao": [["Visagem Etérea", "Voando, vantagem em testes de Presença; em sucesso com Esperança nesses testes, o mestre perde 1 Ponto de Medo em vez de você receber Esperança."]], "maestria": [["Ascensão", "+4 permanente no limiar de dano grave."], ["Poder dos Deuses", "Voando, o dano adicional de Asas de Luz vira 1d12 em vez de 1d8."]]}}, "Assassino": {"Guilda dos Executores": {"atributo": "Agilidade", "fundamentais": [["Primeiro Golpe", "A primeira vez em uma cena que você tiver sucesso em um ataque, você causa dano dobrado."], ["Emboscada", "Sua habilidade \"Marcado para Morrer\" usa d6 em vez de d4."]], "especializacao": [["Golpe da Morte", "Quando você causa dano grave a uma criatura, pode marcar 1 Fadiga para forçá-la a marcar 1 Ponto de Vida adicional."], ["Postura do Escorpião", "Você recebe +2 de Evasão contra ataques feitos por uma criatura que você Marcou para Morrer."]], "maestria": [["Golpe Certeiro", "Uma vez por descanso longo, quando falhar em um ataque, você pode gastar 1 Esperança para transformá-lo em sucesso."], ["Punhalada nas Costas", "Sua habilidade \"Marcado para Morrer\" usa d8 em vez de d6."]]}, "Guilda dos Envenenadores": {"atributo": "Conhecimento", "fundamentais": [["Concoções Tóxicas", "Marque 1 Fadiga para colocar 1d4+1 marcadores nesta carta. Ao ter sucesso em um ataque com arma, você pode gastar 1 marcador para afligir o alvo com um veneno. Você conhece estes venenos: • Pétala-fantasma: o alvo fica temporariamente Vulnerável. • Esporo Sepulcral: o alvo também deve marcar 1 Fadiga. • Erva-sanguessuga: você causa 1d6 de dano extra neste ataque. Ao fazer um descanso longo, remova todos os marcadores não gastos."]], "especializacao": [["Compêndio de Venenos", "Você também conhece estes venenos: • Videira da Meia-noite: o alvo tem desvantagem em rolagens de ataque até marcar 1 Fadiga para encerrar a condição. • Raiz de Górgona: o alvo fica temporariamente Imobilizado."], ["Presa Dupla", "Ao afligir um alvo Marcado para Morrer com um veneno que conhece, você pode gastar 1 marcador adicional para também infligir o efeito de um segundo veneno que conheça."]], "maestria": [["Venenomante", "Você também conhece estes venenos: • Semente da Praga: o alvo recebe −3 nos limiares de dano até o fim da cena (não acumula). • Folha do Medo: você causa dano extra igual ao resultado do seu Dado de Medo neste ataque. • Espinho Cadavérico: o alvo tem desvantagem em testes de reação até o fim da cena."], ["Bênção da Víbora", "Você é imune a venenos e outras toxinas."]]}}, "Lutador": {"Colosso": {"atributo": "", "fundamentais": [["Rústico", "Receba um bônus permanente de +3 no limiar de dano grave."], ["Subjugar", "Quando tiver sucesso em um ataque contra um alvo, você pode gastar 1 Esperança para arremessar o alvo em alcance Próximo ou forçá-lo a marcar 1 Fadiga."]], "especializacao": [["Cercado", "Ao fazer um ataque com arma Corpo a Corpo, você pode gastar qualquer quantidade de Esperança para atingir igual número de criaturas adicionais em alcance Corpo a Corpo."], ["Olho por Olho", "Uma vez por descanso, quando um adversário em alcance Corpo a Corpo forçar você a marcar qualquer quantidade de Pontos de Vida, você pode marcar 1 Fadiga para forçá-lo a marcar a mesma quantidade."]], "maestria": [["Êxtase do Esmagador", "Ao ter sucesso crítico em um ataque Corpo a Corpo, você ganha 1 Esperança adicional, recupera 1 Fadiga adicional e recebe +1 de Proficiência nesse ataque."], ["Ainda Não Acabei", "Ao sofrer dano grave, você pode ganhar 1 Esperança ou recuperar 1 Fadiga."]]}, "Artista Marcial": {"atributo": "", "fundamentais": [["Lutador de Posturas", "Você pode canalizar sua determinação interior para assumir posturas marciais que concedem benefícios especiais em combate. Pegue a ficha de Posturas Marciais e escolha duas posturas do 1º patamar. A cada vez que subir de nível, escolha uma postura adicional do seu patamar ou inferior."]], "especializacao": [["Defesas Aguçadas", "Quando for alvo de um ataque, você pode gastar 1 Foco para receber um bônus de Evasão igual ao seu patamar contra o ataque."], ["Canhão de Foco", "Gaste 1 Foco para fazer um teste de Instinto contra um adversário em alcance Distante. Em sucesso, cause d20+3 de dano mágico usando sua Proficiência."]], "maestria": [["Rompe-limites", "Uma vez por descanso, você pode realizar um feito atlético inacreditável, como correr sobre a água, saltar entre telhados distantes ou escalar um prédio sem precisar rolar. Ao fazer isso, ganhe 1 Esperança e recupere 1 Fadiga."], ["Estado de Fluxo", "Você pode marcar 1 Fadiga em vez de gastar 1 Foco para mudar de postura. Além disso, pode gastar 1 Foco em vez de marcar 1 Fadiga para iniciar um golpe combo."]]}}, "Bruxo": {"Pacto do Eterno": {"atributo": "Presença", "fundamentais": [["Manto do Patrono", "Gaste 1 Favor para se envolver em um aspecto aterrorizante do seu Patrono, que dura até você sofrer dano grave ou a cena acabar. Enquanto o efeito estiver ativo, você recebe bônus nos limiares de dano igual ao seu patamar e tem vantagem em rolagens de ação para intimidar um alvo."], ["Abraço Imortal", "Uma vez por descanso, gaste qualquer quantidade de Favores para rolar igual número de Dados de Patrono. Para cada resultado 4 ou mais, recupere 1 Ponto de Vida."]], "especializacao": [["Invocação Aterradora", "Quando um adversário atacar você ou um aliado em alcance Muito Próximo, você pode gastar 1 Favor para dar desvantagem a ele na rolagem. Se o adversário falhar, ele também deve marcar 1 Fadiga."], ["Escoadouro de Dano", "Uma vez por descanso, você pode gastar 1 Favor para reduzir à metade o dano recebido."]], "maestria": [["Égide Sombria", "Uma vez por descanso longo, ao sofrer dano, você pode gastar 1 Favor em vez de marcar Pontos de Vida."], ["Perdição Drenante", "Quando um adversário atacar você ou um aliado em alcance Muito Próximo, você pode gastar 1 Favor para Drená-lo. Ao fazer isso, ele deve marcar 1 Fadiga e você pode recuperar 1 Fadiga. Enquanto Drenado, o alvo usa d12 em vez de d20 em rolagens de ataque (inclusive para vantagem ou desvantagem) até falhar em uma rolagem."]]}, "Pacto do Furioso": {"atributo": "Presença", "fundamentais": [["Fúria do Patrono", "Gaste 1 Favor para imbuir seus ataques com o poder do Patrono até causar dano grave ou a cena acabar. Ao rolar dano enquanto o efeito estiver ativo, role também Dados de Patrono iguais ao seu patamar e some o total ao dano causado."], ["Vingança Mortal", "Quando marcar qualquer quantidade de Pontos de Vida por um ataque, você pode gastar 1 Favor para rolar igual número de Dados de Patrono. Para cada resultado 4 ou mais, o atacante marca 1 Ponto de Vida."]], "especializacao": [["Alcance Ameaçador", "Gaste 1 Favor para aumentar em um passo o alcance da sua arma principal (por exemplo, de Corpo a Corpo para Muito Próximo, ou de Muito Próximo para Próximo), até no máximo Muito Distante. O efeito termina quando você fizer um ataque bem-sucedido com essa arma."], ["Diminuir Meus Inimigos", "Quando tiver sucesso com Esperança em uma rolagem de ação contra um alvo, você pode gastar qualquer quantidade de Favores para forçá-lo a marcar igual número de Fadiga."]], "maestria": [["Ataque Temível", "Gaste 1 Favor para rolar de novo qualquer quantidade dos seus dados de dano. Você pode continuar gastando Favores nesta habilidade na mesma rolagem de dano."], ["Ira de Outro Mundo", "Uma vez por descanso, ao sofrer dano, gaste qualquer quantidade de Favores para rolar essa quantidade de Dados de Patrono e escolher um número de criaturas em alcance Próximo igual ao maior resultado. Cada alvo deve marcar 1 Ponto de Vida."]]}}, "Bruxa": {"Sebe": {"atributo": "Conhecimento", "fundamentais": [["Remédios de Ervas", "Quando você ou um aliado na cena recuperar 1 ou mais Pontos de Vida ou Fadiga pelo uso de um consumível, aumente em 1 a quantidade recuperada."], ["Talismã Encantado", "Uma vez por descanso, você pode imbuir um pequeno item com sua essência protetora. Gaste qualquer quantidade de Esperança para colocar igual número de marcadores nesta carta. Quando quem estiver segurando o talismã sofrer dano, gaste 1 marcador para reduzir em 1 os Pontos de Vida que ele marca. Remova todos os marcadores desta carta ao descansar."]], "especializacao": [["Caminhar Entre Mundos", "Num momento de calma, faça um teste de conjuração (13). Uma vez por descanso, em sucesso, você pode marcar 1 Fadiga para atravessar o véu da morte e conversar com espíritos próximos. Coloque nesta carta marcadores iguais ao seu atributo de conjuração e remova um a cada vez que um espírito responder uma pergunta. Quando o último for removido, ou ao fim da cena, você volta ao Reino Mortal no mesmo lugar de onde saiu."], ["Maldição Irritante", "Você tem vantagem em ataques contra criaturas sob Malefício."]], "maestria": [["Círculo de Poder", "Uma vez por descanso, marque no chão um círculo delimitando uma área Muito Próxima ao seu redor e coloque nesta carta marcadores iguais ao seu atributo de conjuração. Dentro do círculo, você e seus aliados recebem +2 nos limiares de dano, rolagens de ataque e Evasão. Remova um marcador a cada vez que você ou um aliado no círculo fizer uma rolagem de ação ou se esquivar de um ataque. A magia dura até o último marcador ser removido ou você sair do círculo."]]}, "Lua": {"atributo": "Instinto", "fundamentais": [["Glamour Noturno", "Faça um teste de conjuração (13) para se revestir de uma fachada enfeitiçante. Enquanto estiver sob Glamour, você tem vantagem em rolagens que explorem sua aparência ilusória. Além disso, adversários em alcance Próximo devem marcar 1 Fadiga para atacar você. A menos que você marque 1 Fadiga para manter o Glamour, ele se desfaz quando você marca um Ponto de Vida ou causa dano."]], "especializacao": [["Raio de Lua", "Uma vez por sessão, você pode conjurar uma coluna de luar que ilumina a área em alcance Próximo até o fim da cena. Enquanto banhados por esse luar, você e seus aliados recebem +1 em testes de conjuração e enxergam através de ilusões."], ["Ira da Luz Pálida", "Quando uma criatura sob Malefício em alcance Muito Distante falhar em um ataque, ela deve marcar 1 Fadiga."]], "maestria": [["Fases da Lua", "No início de cada sessão, role 1d6 e coloque-o nesta carta. Você recebe o efeito correspondente até o fim da sessão: 1 Nova — gaste 1 Esperança para anular dano leve. 2–3 Crescente — +2 nas rolagens de dano. 4 Cheia — +3 nos limiares de dano. 5–6 Minguante — +1 de Evasão. Uma vez por descanso, você pode gastar 1 Esperança para aumentar em 1 o valor desse dado; se aumentar um 6, ele vira 1."]]}}};
const DOMAIN_CARDS = {"Arcano": [["Caminhar na Parede", 1, "Feitiço", 1, "Gaste 1 Esperança: uma criatura tocada por você pode escalar paredes e tetos como se fosse chão. Dura até o fim da cena ou até conjurar de novo."], ["Caos Liberto", 1, "Feitiço", 1, "No início da sessão, coloque marcadores iguais ao seu atributo de conjuração. Teste de conjuração contra um alvo Distante gastando marcadores: role d10 iguais aos marcadores gastos como dano mágico. Marque 1 PF para recarregar. Marcadores não usados são perdidos no fim da sessão."], ["Proteção Rúnica", 1, "Feitiço", 0, "Um talismã pessoal usável por você ou um aliado: gaste 1 Esperança para reduzir o dano sofrido em 1d8. Ao tirar 8, o poder se encerra até seu próximo descanso."], ["Incendiar", 2, "Feitiço", 1, "Teste de conjuração contra um alvo CaC. Em sucesso, ele sofre 1d20+3 de dano mágico e fica Em Chamas, sofrendo 2d6 adicional a cada ação enquanto durar."], ["Olho Flutuante", 2, "Feitiço", 0, "Gaste 1 Esperança para criar um orbe móvel em alcance Muito Distante; veja pelos seus olhos ou pelos dele à vontade. Termina se o orbe sofrer dano ou sair do alcance."], ["Contramágica", 3, "Feitiço", 2, "Teste de reação com seu atributo de conjuração para interromper um efeito mágico em andamento. Em sucesso, o efeito termina sem consequências e a carta vai para a reserva."], ["Voo", 3, "Feitiço", 1, "Teste de conjuração (15): coloque marcadores iguais à sua Agilidade (mín. 1). Gaste 1 marcador por teste feito enquanto voa; ao consumir o último, você desce ao solo."], ["Impacto Defensivo", 4, "Feitiço", 2, "Teste de conjuração contra todos os alvos CaC: empurra-os para alcance Distante e causa d8+3 de dano mágico com seu atributo de conjuração."], ["Translocação", 4, "Feitiço", 1, "Teste de conjuração (12): gaste 1 Esperança para se teleportar a um ponto visível em alcance Distante; +1 Esperança por criatura voluntária Muito Próxima que quiser levar."], ["Corrente de Relâmpagos", 5, "Feitiço", 1, "Marque 2 PF: teste de conjuração libera relâmpagos contra alvos Próximos (reação com Dificuldade igual ao seu resultado). Falha = 2d8+4 de dano mágico, propagando para adversários Próximos adicionais até acabarem os alvos."], ["Premonição", 5, "Feitiço", 2, "Uma vez por descanso longo, logo após o mestre revelar as consequências de um teste seu, ignore esse movimento e faça outro no lugar."], ["Fenda Espacial", 6, "Feitiço", 2, "Teste de conjuração (15): marca o solo onde está. Ao conjurar de novo, abre um portal seguro até essa marca; permanece até você fechar ou conjurar outro feitiço."], ["Telecinese", 6, "Feitiço", 0, "Teste de conjuração contra alvo Distante: mova-o dentro do alcance Distante ou arremesse-o como ataque contra um segundo alvo (teste adicional), causando d12+4 de dano físico com sua Proficiência."], ["Dom Arcano", 7, "Talento", 2, "Se 4+ cartas de domínio na mão forem do Arcano: +1 em testes de conjuração; uma vez por descanso, troque os resultados de Esperança e Medo um pelo outro."], ["Ocultação", 7, "Feitiço", 2, "Ao ter sucesso conjurando outro feitiço, gaste 1 Esperança para ficar Oculto (regras de Oculto do Ladino)."], ["Aura de Confusão", 8, "Feitiço", 2, "Teste de conjuração (14), uma vez por descanso longo: crie camadas ilusórias (marque Fadiga = nº de camadas). Ao ser atacado, role d6 por camada; 5+ destrói uma camada e anula o ataque; se todos forem 4 ou menos, sofre o dano e o feitiço termina."], ["Reflexo Arcano", 8, "Feitiço", 1, "Ao sofrer dano mágico, gaste Esperança e role d6 equivalentes; um 6 reflete o ataque de volta ao atacante."], ["Projeção Sensorial", 9, "Feitiço", 0, "Uma vez por descanso, teste de conjuração (15): entre numa visão de um lugar já visitado, vendo e ouvindo livremente, sem corpo físico e indetectável. Termina ao sofrer dano ou conjurar outra magia."], ["Terremoto", 9, "Feitiço (arcano)", 2, "Teste de conjuração (16), uma vez por descanso: alvos Muito Distantes que não voam fazem reação (18); falha = 3d10+8 de dano físico e Vulnerável, sucesso = metade. O terreno na área fica difícil e estruturas podem desabar."], ["Ajustar Realidade", 10, "Feitiço", 1, "Ao fazer uma rolagem (sua ou de um aliado voluntário), gaste 5 Esperança para mudar o resultado para outro plausível à sua escolha."], ["Chuva Arcana", 10, "Feitiço (arcano)", 1, "Teste de conjuração contra todos em alcance Distante; marque Fadiga à vontade para causar 1d20+2 de dano mágico por Fadiga marcada a cada alvo."]], "Códice": [["Livro de Ava", 1, "Grimório", 2, "Propelir: teste de conjuração contra alvo CaC — empurra para Distante e causa d10+2 de dano mágico com Proficiência. Armadura de Tava: gaste 1 Esperança para +1 na Armadura de um alvo tocado até seu próximo descanso. Estaca de Gelo: teste de conjuração (12) invoca um espinho de gelo Distante; como arma, causa d6 de dano físico com Proficiência."], ["Livro de Illiat", 1, "Grimório", 2, "Sonolência: teste de conjuração contra alvo Muito Próximo — em sucesso, fica Adormecido até sofrer dano ou o mestre gastar 1 Medo. Saraivada Arcana: uma vez por descanso, gaste Esperança para atirar projéteis; role d6 iguais à Esperança gasta como dano mágico. Telepatia: gaste 1 Esperança para criar comunicação mental com um alvo visível até o próximo descanso."], ["Livro de Tyfar", 1, "Grimório", 2, "Chama Selvagem: teste de conjuração contra até três adversários CaC — 2d6 de dano mágico e marcam 1 PF. Mão Arcana: conjura uma mão mágica idêntica à sua em alcance Distante. Névoa Misteriosa: teste de conjuração (13) cria névoa densa numa área Muito Próxima, obscurecendo tudo dentro dela."], ["Livro de Sitil", 2, "Grimório", 2, "Ajustar Aparência: muda sua aparência e vestimentas para evitar reconhecimento. Paralelos: gaste 2 Esperança sobre si ou aliado Próximo; no próximo ataque dele, pode acertar um alvo adicional dentro do alcance. Ilusão: teste de conjuração (14) cria ilusão visual Próxima enquanto olhar para ela."], ["Livro de Vagras", 2, "Grimório", 2, "Portal Arcano: sem adversários CaC, teste (13) e gaste 1 Esperança para abrir um portal até um ponto visível Distante, que fecha após uma criatura passar. Revelar: teste de conjuração revela o que estiver escondido por magia Próximo. Tranca Rúnica: teste (15) tranca um objeto que só abre para quem você designar; quebrável em uma hora por quem tem acesso a magia."], ["Livro de Korvax", 3, "Grimório", 2, "Círculo Rúnico: marque 1 PF para criar um círculo mágico; adversários que entrem ou fiquem CaC sofrem 2d12+4 de dano mágico e são empurrados a Muito Próximo. Lapso: gaste 1 Esperança para forçar reação (15) num alvo CaC; falha = esquece o último minuto de conversa. Levitação: teste de conjuração suspende um alvo visível e o move a um ponto Próximo."], ["Livro de Norai", 3, "Grimório", 2, "Amarração Mística: teste contra alvo Distante — fica Imobilizado e marca 1 PF; se voando, aterrissa Imobilizado. Bola de Fogo: teste contra alvo Muito Distante — ele e Muito Próximos fazem reação (13); falha = d20+5 de dano mágico com Proficiência, sucesso = metade."], ["Livro de Ecsota", 4, "Grimório", 3, "Criar Construto: gaste 1 Esperança para animar objetos ao redor num construto que compartilha sua Evasão/atributos e causa 2d10+3 de dano físico; só um por vez, desfaz-se ao sofrer qualquer dano. Repudiar: teste de conjuração para interromper um efeito mágico em andamento, uma vez por descanso."], ["Livro de Grynn", 4, "Grimório", 2, "Deflexão: uma vez por descanso longo, gaste 1 Esperança para negar o dano de um ataque contra você ou aliado Muito Próximo. Muralha de Fogo: teste (15) cria muralha entre dois pontos Distantes; atravessá-la causa 4d10+3 de dano mágico. Tranca Temporal: um objeto Distante para no tempo até seu próximo descanso; movê-lo exige teste de conjuração seu."], ["Muralha", 5, "Feitiço", 2, "Teste de conjuração (15). Em sucesso, gaste 1 Esperança uma vez por descanso para erguer uma parede mágica de até 15m entre dois pontos Distantes, desviando criaturas e objetos para um lado à sua escolha. Perdura até seu próximo descanso ou até conjurar de novo."], ["Teleporte", 5, "Feitiço", 2, "Uma vez por descanso longo, teleporte a si e voluntários Próximos para um lugar já visitado. Teste de conjuração (16) com modificador conforme familiaridade (+3 muito bem, +1 alguma frequência, 0 pouco, −2 uma vez). Em sucesso chega ao destino certo; em falha, aparece em outro lugar conforme o grau da falha."], ["Banir", 6, "Feitiço", 0, "Teste de conjuração contra alvo Próximo: role d20 igual ao seu atributo de conjuração; o alvo faz reação com Dificuldade igual ao maior resultado. Sucesso = marca 1 PF; falha (uma vez por descanso) = é banido do reino. Ao rolar com Medo, a Dificuldade cai -1 e o alvo tenta voltar."], ["Sigilo da Retaliação", 6, "Feitiço", 2, "Marque um adversário Próximo; o mestre ganha 1 Medo. Quando ele causar dano a você/aliados, coloque 1d8 nesta carta (máx. = seu nível). Ao acertá-lo, some o total dos dados ao dano e descarte-os. Termina quando ele é derrotado ou você conjura de novo."], ["Dom do Códice", 7, "Talento", 2, "Se 4+ cartas de domínio na mão forem do Códice: marque 1 PF para somar Proficiência a um teste de conjuração; uma vez por descanso, troque esta carta por outra da reserva sem custo."], ["Livro de Homet", 7, "Grimório", 0, "Atravessar: teste (13), uma vez por descanso — você e quem tocar podem atravessar uma parede ou porta Próxima até todos passarem. Portal Planar: teste (14), uma vez por descanso longo, abre portal para um plano/dimensão já visitado, durando até seu próximo descanso."], ["Livro de Vyola", 8, "Grimório", 2, "Clareza Compartilhada: uma vez por descanso longo, gaste 1 Esperança para que duas criaturas voluntárias possam escolher qual marca Fadiga entre elas, até o próximo descanso. Sondar Memórias: teste contra alvo Distante para espionar a mente e fazer uma pergunta ao mestre sobre memórias relacionadas."], ["Refúgio Seguro", 8, "Feitiço", 3, "Com alguns minutos de calma, gaste 2 Esperança para invocar um abrigo interdimensional acessado por uma porta Próxima, só para quem você designar. Descansar lá dá um movimento de repouso adicional."], ["Livro de Ronin", 9, "Grimório", 4, "Enervação Eterna: uma vez por descanso longo, teste contra alvo Próximo — em sucesso, fica permanentemente Vulnerável e não pode se curar disso. Transformação: teste (15) transforma você em objeto inanimado de até o dobro do seu tamanho, até sofrer dano."], ["Onda Desintegradora", 9, "Feitiço", 4, "Teste (18), uma vez por descanso longo: o mestre revela quais adversários Distantes têm dificuldade 18 ou menor. Marque 1 PF por alvo atingido; ele morre e não pode voltar à vida por meio algum."], ["Livro de Yarrow", 10, "Grimório", 2, "Imunidade Mágica: gaste 5 Esperança para ficar imune a dano mágico até seu próximo descanso. Manipulação Temporal: teste (18) desacelera o tempo até parar tudo em alcance Distante exceto você, até seu próximo teste contra outra criatura."], ["União Transcendental", 10, "Feitiço", 1, "Uma vez por descanso longo, gaste 5 Esperança sobre duas ou mais criaturas voluntárias; até o próximo descanso, quando uma marcar PV ou Fadiga, as conectadas podem escolher qual delas marcará."]], "Esplendor": [["Raio Luminoso", 1, "Feitiço", 1, "Teste de conjuração contra alvo Distante. Em sucesso, gaste 1 Esperança para causar d8+2 de dano mágico com Proficiência; o alvo fica temporariamente Vulnerável e emite luz intensa até se recuperar."], ["Toque Reparador", 1, "Feitiço", 1, "Toque uma criatura e canalize cura; gastando alguns minutos e 2 Esperança, ela recupera 1 PV ou Fadiga. Uma vez por descanso longo, ao revelar algo novo durante a cura, recupera 2 em vez de 1."], ["Validação", 1, "Talento", 0, "Uma vez por descanso, após o teste de um aliado mas antes das consequências, apoie-o com palavras: ele pode rolar os dados de novo."], ["Mãos Curativas", 2, "Feitiço", 1, "Teste de conjuração (13) num alvo CaC que não seja você. Sucesso: marque 1 PF para recuperar 2 PV ou Fadiga do alvo. Falha: marque 1 PF para recuperar 1. Não pode repetir no mesmo alvo até o próximo descanso longo."], ["Últimas Palavras", 2, "Feitiço", 1, "Conceda um momento de vida a um cadáver para conversar. Teste (13): sucesso com Esperança = três perguntas; com Medo = uma pergunta. O cadáver responde com sinceridade só o que sabia em vida, depois vira pó."], ["Novo Fôlego", 3, "Talento", 2, "Uma vez por descanso, ao acertar um ataque, recupere 1 PV ou 3 Fadiga. Com sucesso de Esperança, um aliado Próximo também recupera 1 PV ou 3 Fadiga."], ["Voz da Razão", 3, "Talento", 1, "Vantagem em testes para acalmar situações violentas ou convencer alguém a obedecer. Quando toda sua Fadiga estiver marcada, +1 na Proficiência para rolagens de dano."], ["Adivinhação", 4, "Feitiço", 1, "Uma vez por descanso longo, gaste 3 Esperança para se comunicar com forças além e fazer uma pergunta de sim/não sobre o futuro próximo."], ["Sigilo da Vida", 4, "Feitiço", 1, "Gaste 3 Esperança e marque um aliado Próximo com um sigilo; ao fazer um movimento de morte, ele recupera 1 PV em vez disso. Termina ao salvar o alvo, ao conjurar em outro alvo, ou num descanso longo."], ["Moldar Material", 5, "Feitiço", 1, "Gaste 1 Esperança para moldar à vontade um material natural que esteja tocando (gelo, madeira, pedra), até seu tamanho — como criar uma ferramenta ou porta."], ["Punição", 5, "Feitiço", 2, "Uma vez por descanso, gaste 3 Esperança para carregar sua Punição; no próximo ataque de arma, dobre o dano rolado e trate-o como dano mágico independente do tipo da arma."], ["Restauração", 6, "Feitiço", 2, "Após um descanso longo, coloque marcadores iguais ao seu atributo de conjuração; toque uma criatura e gaste marcadores para recuperar 2 PV/Fadiga por marcador, ou gaste um para curar Vulnerável/doença."], ["Zona de Proteção", 6, "Feitiço", 2, "Teste (16), uma vez por descanso longo: cria zona de proteção Muito Próxima visível para aliados; coloque 1d6 (começa em 1) que reduz dano sofrido por aliados na zona e aumenta em 1 a cada uso, terminando ao passar de 6."], ["Dom do Esplendor", 7, "Talento", 2, "Se 4+ cartas na mão forem do Esplendor: +3 no limiar de dano grave; uma vez por descanso longo, ao ser forçado a marcar PV, marque Fadiga equivalente ou gaste Esperança equivalente em vez disso."], ["Golpe Curativo", 7, "Feitiço", 1, "Ao causar dano a um adversário, gaste 2 Esperança para recuperar 1 PV de um aliado Próximo."], ["Aura Defensora", 8, "Feitiço", 2, "Marque 1 PF para conjurar uma aura protetora sobre um alvo Muito Próximo; ao marcar Ponto de Armadura, ele reduz a gravidade em um limiar adicional. Só uma criatura protegida por vez."], ["Fulgor Atordoante", 8, "Feitiço", 2, "Teste de conjuração disparando raios contra adversários Distantes à frente; gaste Esperança para forçar reações (14) — sucesso = 3d20+3 de dano mágico; falha = 4d20+5 e fica Atordoado (sem reações ou ações)."], ["Aura Esmagadora", 9, "Feitiço", 2, "Teste (15) para fortalecer sua aura; gaste 2 Esperança para igualar sua Presença ao atributo de conjuração até o próximo descanso longo. Adversários que o mirarem em ataque marcam 1 PF."], ["Feixe de Remissão", 9, "Feitiço", 2, "Teste (16): marque Fadiga à vontade para escolher uma linha de aliados Distantes e recuperar Pontos de Vida entre eles, total igual à Fadiga marcada."], ["Ressurreição", 10, "Feitiço", 2, "Teste (20): traz de volta à vida uma criatura morta há no máximo 100 anos, com todas as capacidades. Role 1d6; em 5 ou menos, a carta vai para a reserva permanentemente. Se falhar, não pode conjurar de novo por uma semana."], ["Revigorar", 10, "Feitiço", 3, "Após você ou aliado Próximo usar uma habilidade limitada, gaste Esperança e role um d6 por ponto gasto; um 6 permite usar a habilidade de novo."]], "Falange": [["Intocável", 1, "Talento", 1, "Bônus na Evasão igual à metade da sua Agilidade."], ["Movimento Ligeiro", 1, "Talento", 0, "Uma vez por descanso, marque 1 PF para se deslocar a qualquer ponto Distante sem teste de Agilidade. Terminando CaC a um adversário e atacando de imediato, +1 no teste de ataque."], ["Um Passo à Frente", 1, "Talento", 1, "Ao ser alvo de ataque de fora do CaC, marque 1 PF para jogar 1d4 e somar o resultado à sua Evasão."], ["Aproximação Estratégica", 2, "Talento", 1, "Após um descanso longo, coloque marcadores iguais ao Conhecimento (mín. 1). Na primeira vez que se mover para Próximo de um adversário e atacá-lo, gaste um marcador: vantagem no ataque, ou recupere 1 PF de um aliado CaC ao adversário, ou +1d8 no dano."], ["Ferocidade", 2, "Talento", 2, "Ao fazer um adversário marcar 1+ PV, gaste 2 Esperança para aumentar sua Evasão em número igual aos PV marcados, até o fim do próximo ataque contra você."], ["Resistir", 3, "Talento", 1, "Ao marcar 1 Ponto de Armadura para reduzir dano, marque 1 PF para marcar mais 1 Ponto de Armadura adicional."], ["Táticas", 3, "Talento", 1, "Ao Prestar Ajuda, gaste 1 Esperança para somar uma Experiência à rolagem, além do dado de vantagem. Em teste em dupla, use 1d20 como Dado de Esperança."], ["Impulso", 4, "Talento", 1, "Marque 1 PF para usar um aliado Próximo voluntário como impulso e fazer um ataque aéreo contra alvo Distante, com vantagem, +1d10 no dano, terminando CaC ao alvo."], ["Redirecionar", 4, "Talento", 1, "Quando um ataque de fora do CaC falha contra você, role d6 iguais à Proficiência; um 6 permite marcar 1 PF para redirecionar o dano a um adversário Muito Próximo."], ["Conhece Teu Inimigo", 5, "Talento", 1, "Observando uma criatura, teste de Instinto contra ela; em sucesso, gaste 1 Esperança e pergunte ao mestre sobre PV/Fadiga, Dificuldade/limiares, táticas/dados de dano, ou habilidades/Experiências. Sucesso pode marcar 1 PF para tirar -1 Medo do mestre."], ["Golpe Pessoal", 5, "Talento", 1, "Tenha um golpe icônico nomeado. Uma vez por descanso, ao usá-lo, role 1d20 como Dado de Esperança; em sucesso, recupere 1 PF."], ["Contra-Ataque Rápido", 6, "Talento", 0, "Quando um ataque CaC falha contra você, marque 1 PF para causar o dano de uma de suas armas ativas ao atacante."], ["Recuperação", 6, "Talento", 1, "Num descanso curto, escolha um movimento de repouso de descanso longo. Gaste 1 Esperança para permitir isso a um aliado também."], ["Dom da Falange", 7, "Talento", 2, "Se 4+ cartas na mão forem da Falange: +1 na Agilidade; uma vez por descanso, gaste 3 Esperança para fazer um ataque bem-sucedido contra você falhar."], ["Acuidade Cruel", 7, "Talento", 1, "Ao acertar com uma arma, receba bônus igual à sua Acuidade ou Agilidade na rolagem de dano."], ["Amontoar", 8, "Talento", 1, "Teste de Agilidade contra todos os alvos Próximos; gaste 1 Esperança para mover os acertados e aliados Próximos voluntários para outro ponto Próximo."], ["Golpe Debilitante", 8, "Talento", 3, "Ao acertar, marque 1 PF para que o próximo ataque bem-sucedido no mesmo alvo cause 2d12 de dano adicional."], ["Quase Lá", 9, "Talento", 1, "Com 2 PV ou menos desmarcados, você não sofre dano leve."], ["Ataque Fragmentado", 9, "Talento", 3, "Gaste 1 Esperança e ataque todos os adversários no alcance da arma; uma vez por descanso longo, some todo o dano causado e redistribua entre os alvos, rolando um dado extra por alvo."], ["Passo Célere", 10, "Talento", 2, "Quando um ataque falha contra você, recupere 1 PF; se não puder, receba 1 Esperança."], ["Trajeto Mortal", 10, "Talento", 1, "Gaste 3 Esperança para percorrer o campo de batalha em linha reta até um ponto Distante, atacando todos os adversários no caminho; o primeiro sofre o dano completo com +1 na Proficiência, e cada alvo seguinte perde um dado de dano."]], "Graça": [["Dissimulação", 1, "Talento", 0, "Gaste 1 Esperança para vantagem em um teste para enganar ou convencer alguém de uma mentira."], ["Enfeitiçar", 1, "Feitiço", 0, "Teste de conjuração contra alvo Próximo; em sucesso, fica Enfeitiçado (atenção fixa em você). Uma vez por descanso, marque 1 PF para forçá-lo a marcar 1 PF também."], ["Palavras Inspiradoras", 1, "Talento", 1, "Após um descanso longo, coloque marcadores iguais à sua Presença. Ao falar com um aliado, gaste um marcador para: recuperar 1 PF dele; recuperar 1 PV dele; ou dar-lhe 1 Esperança."], ["Insolência", 2, "Talento", 2, "Ao insultar/provocar um alvo Distante, teste de Presença; uma vez por descanso, em sucesso, role d4 iguais à Proficiência e o alvo marca Fadiga igual ao maior resultado."], ["Não Minta para Mim", 2, "Feitiço", 1, "Teste de conjuração contra alvo Muito Próximo; em sucesso, ele não pode mentir para você em alcance Próximo. Recusar responder marca 1 PF nele e encerra o efeito."], ["Invisibilidade", 3, "Feitiço", 1, "Teste (10): marque 1 PF para deixar você ou aliado CaC Invisível (só visível por magia; ataques contra ele com desvantagem). Coloque marcadores iguais ao atributo de conjuração; cada movimento gasta um. Só uma criatura invisível por vez."], ["Lampejo Hipnótico", 3, "Feitiço", 1, "Teste contra todos os adversários Próximos à frente; uma vez por descanso, em sucesso, ficam Atordoados e marcam 1 PF."], ["Espionar", 4, "Feitiço", 1, "Escolha um alvo Muito Distante; veja e ouça por seus sentidos à vontade até seu próximo descanso ou até conjurar de novo."], ["Palavras Tranquilizantes", 4, "Talento", 1, "Num descanso curto, ao ajudar alguém tratando ferimentos, ele recupera 1 PV adicional e você recupera 2 PV."], ["Palavras de Discórdia", 5, "Feitiço", 1, "Sussurre discórdia a um adversário CaC e teste (13); sucesso = marca 1 PF e ataca outro adversário. Repetir sobre ele depois disso dá -5 no teste."], ["Sondar Pensamentos", 5, "Feitiço", 2, "Gaste 1 Esperança para ler pensamentos superficiais de alvo Distante; teste de conjuração contra ele para sondar pensamentos profundos. Rolar com Medo pode revelar que você está lendo a mente dele."], ["Jamais Esquecido", 6, "Talento", 2, "Ao marcar 1+ PV num ataque, marque 1 PF para colocar marcadores iguais aos PV marcados; cada marcador dá +5 na rolagem de dano do próximo ataque bem-sucedido, depois zera."], ["Partilhar o Fardo", 6, "Feitiço", 0, "Uma vez por descanso, absorva a Fadiga de uma criatura CaC voluntária; transfira Fadiga dela para você e receba 1 Esperança por Fadiga transferida."], ["Carisma Infinito", 7, "Talento", 1, "Após um teste de favores, mentira ou persuasão, gaste 1 Esperança para rolar de novo o Dado de Esperança ou Medo."], ["Dom da Graça", 7, "Talento", 2, "Se 4+ cartas na mão forem da Graça: marque 1 Ponto de Armadura em vez de 1 PF; ao forçar um alvo a marcar PV, pode forçá-lo a marcar Fadiga equivalente em vez disso."], ["Enfeitiçar em Massa", 8, "Feitiço", 3, "Teste contra todos os alvos Distantes; ficam Enfeitiçados. Marque 1 PF para forçá-los a marcar 1 PF, encerrando o feitiço."], ["Projeção Astral", 8, "Feitiço", 0, "Uma vez por descanso longo, marque 1 PF para projetar uma cópia sua em um lugar já visitado; veja, ouça e afete o mundo por ela. Dura até seu próximo descanso ou até sofrer dano."], ["Imitador", 9, "Feitiço", 3, "Uma vez por descanso longo, imite habilidades de outra carta de domínio de nível 8 ou menor na mão de outro jogador, gastando Esperança igual à metade do nível da carta."], ["Mestre do Ofício", 9, "Talento", 0, "+2 permanente em duas Experiências, ou +3 em apenas uma; depois vai para a reserva permanentemente."], ["Em Dobro", 10, "Feitiço", 1, "Quando um aliado Próximo causa dano a um adversário, teste de conjuração contra ele para causar o mesmo dano. Rolar com Medo manda a carta para a reserva."], ["Notoriedade", 10, "Talento", 0, "Marque 1 PF antes de um teste para +10 no resultado. Você recebe comida e bebida grátis e desconto de uma bolsa nas compras."]], "Lâmina": [["Levante-se", 1, "Talento", 1, "Ao sofrer dano grave, marque 1 PF para reduzir a gravidade em um limiar."], ["Não o Suficiente", 1, "Talento", 1, "Ao rolar dados de dano, role de novo quaisquer resultados 1 ou 2."], ["Turbilhão", 1, "Talento", 0, "Ataque um alvo Muito Próximo; em sucesso, gaste 1 Esperança para afetar todos os outros alvos Muito Próximos com o mesmo ataque, causando metade do dano aos adicionais."], ["Ataque Imprudente", 2, "Talento", 1, "Marque 1 PF para receber vantagem num teste de ataque."], ["Fraternidade Marcial", 2, "Talento", 1, "Uma vez por descanso longo, ao elogiar ou perguntar sobre algo que alguém faz bem, vocês recebem 3 Esperança."], ["Mexa-se", 3, "Talento", 1, "Uma vez por descanso, quando uma criatura CaC for causar dano a você, evite o ataque e saia com segurança do alcance."], ["Versatilidade", 3, "Talento", 1, "Use um atributo diferente do exigido por uma arma equipada. Ao causar dano, marque 1 PF para usar o valor máximo de um dado de dano."], ["Armadura Fortificada", 4, "Talento", 0, "+2 nos limiares de dano enquanto usa armadura."], ["Concentração Mortal", 4, "Talento", 2, "Uma vez por descanso, concentre-se totalmente num alvo para +1 na Proficiência contra ele, até derrotá-lo, atacar outro alvo ou a batalha terminar."], ["Vantagem do Campeão", 5, "Talento", 1, "Em sucesso crítico, gaste até 3 Esperança para escolher, por ponto: recuperar 1 PV; recuperar 1 Ponto de Armadura; ou o alvo marca 1 PV adicional."], ["Vitalidade", 5, "Talento", 0, "Receba dois permanentemente: 1 PF adicional; 1 PV adicional; +2 nos limiares de dano. Depois vai para a reserva permanentemente."], ["Calejado pela Batalha", 6, "Talento", 2, "Uma vez por descanso longo, ao fazer um movimento de morte, gaste 1 Esperança para recuperar 1 PV em vez disso."], ["Fúria", 6, "Talento", 1, "Antes de atacar, marque 1 PF para +2× sua Força na rolagem de dano; pode ativar duas vezes por ataque."], ["Dom da Lâmina", 7, "Talento", 1, "Se 4+ cartas na mão forem da Lâmina: +2 em testes de ataque; +4 no limiar de dano grave."], ["Golpe de Raspão", 7, "Talento", 1, "Ao errar, marque 1 PF para causar o dano da arma usando metade da Proficiência."], ["Grito de Guerra", 8, "Talento", 2, "Uma vez por descanso longo, ao se lançar ao perigo, emita um grito de guerra: aliados que ouvirem recuperam 1 PF e ganham 1 Esperança, e atacam com vantagem até alguém errar com Medo."], ["Frenesi", 8, "Talento", 3, "Uma vez por descanso longo, entre Em Frenesi até não haver mais adversários à vista: não pode usar PA, mas ganha +10 em dano e +8 no limiar de dano grave."], ["Golpe da Morte", 9, "Talento", 3, "Uma vez por descanso longo, gaste 1 Esperança e faça um teste de ataque; o mestre revela contra quais alvos no alcance ele teria sucesso — force um deles a marcar 5 PV."], ["Guerra e Glória", 9, "Talento", 2, "Em sucesso crítico ao atacar, +1 Esperança ou recupere 1 PF; ao derrotar um inimigo, +1 Esperança ou recupere 1 PF."], ["Massacrar", 10, "Talento", 3, "Ataques com sua arma nunca causam menos que o limiar de dano maior do alvo. Quando alguém causar dano a um aliado no alcance da sua arma sem ter você como alvo, marque 1 PF para forçar reação (15); falha = marca 1 PV."], ["Monstro de Batalha", 10, "Talento", 0, "Ao acertar, em vez de rolar dano, marque 4 PF para forçar o alvo a marcar PV igual à sua Fadiga marcada atual."]], "Meia-noite": [["Chuva de Lâminas", 1, "Feitiço", 1, "Gaste 1 Esperança para teste de conjuração e arremessar lâminas contra todos os alvos Muito Próximos, causando d8+2 de dano mágico com Proficiência (+1d8 se Vulnerável)."], ["Delinquente", 1, "Talento", 0, "Vantagem em testes para arrombar fechaduras não mágicas, desarmar armadilhas não mágicas ou roubar itens."], ["Disfarce Inquietante", 1, "Feitiço", 0, "Com minutos para se preparar, marque 1 PF para assumir a forma de um humanoide já visto, com vantagem em Presença para evitar ser descoberto enquanto durar (marcadores = atributo de conjuração, gastos por movimento)."], ["Espírito da Meia-noite", 2, "Feitiço", 1, "Gaste 1 Esperança para invocar um espírito humanoide que se move ou carrega coisas até seu próximo descanso, ou ataque com ele (teste contra alvo Muito Distante; sucesso = d6 iguais ao atributo de conjuração como dano mágico, depois se dissipa)."], ["Sombra Traiçoeira", 2, "Feitiço", 0, "Teste contra todos os adversários Muito Próximos; ficam temporariamente Imobilizados pela própria sombra."], ["Estrangulamento", 3, "Talento", 1, "Atrás de uma criatura de tamanho similar, marque 1 PF para estrangulá-la, deixando-a Vulnerável; ataques contra ela assim causam 2d6 adicional."], ["Véu da Noite", 3, "Feitiço", 1, "Teste (13) cria cortina de escuridão entre dois pontos Distantes só visível por você; você fica Escondido de quem está do outro lado e tem vantagem ao atacar através dela, até conjurar outro feitiço."], ["Glifo do Ocaso", 4, "Feitiço", 1, "Teste contra alvo Muito Próximo; gaste 1 Esperança para conjurar um glifo que reduz a Dificuldade dele em valor igual ao seu Conhecimento (mín. 1)."], ["Mestre da Furtividade", 4, "Talento", 0, "Ao rolar com Medo tentando se mover sem ser percebido, marque 1 PF para rolar com Esperança em vez disso; o mesmo vale para um aliado Próximo."], ["Recuo Espectral", 5, "Feitiço", 2, "Gaste 1 Esperança para ativar Recuo Espectral onde está; gaste outra Esperança antes do próximo descanso para reaparecer nesse ponto original."], ["Silêncio", 5, "Feitiço", 1, "Teste contra alvo Próximo; gaste 1 Esperança para Silenciá-lo (não pode fazer barulho nem conjurar) numa área Muito Próxima que o acompanha, até o mestre gastar 1 Medo, você conjurar de novo, ou sofrer dano maior."], ["Disfarce em Massa", 6, "Feitiço", 0, "Com minutos de silêncio, marque 1 PF para alterar a aparência de criaturas Próximas voluntárias (vantagem em Presença); ativa uma contagem regressiva (8) que encerra o disfarce."], ["Sussurros Sombrios", 6, "Feitiço", 0, "Comunique-se mentalmente com quem já teve contato físico; marque 1 PF para perguntar ao mestre onde a pessoa está, o que faz, do que tem medo, ou com o que se preocupa."], ["Dom das Sombras", 7, "Talento", 2, "Se 4+ cartas na mão forem da Meia-noite: uma vez por descanso, com 0 Esperança e o mestre for ganhar Medo, receba 1 Esperança em vez disso; ao acertar, marque 1 PF para somar o Dado de Medo ao dano."], ["Esvanecer", 7, "Feitiço", 1, "Quando um ataque físico falha contra você, gaste 1 Esperança para ficar Escondido em sombras e teleportar-se Próximo do atacante, permanecendo escondido até seu próximo teste."], ["Caçador Sombrio", 8, "Talento", 2, "Na penumbra ou escuridão, +1 na Evasão e vantagem em testes de ataque."], ["Carga Mágica", 8, "Feitiço", 1, "Ao sofrer dano mágico, coloque marcadores iguais aos PV marcados (máx. = atributo de conjuração). Ao acertar, gaste marcadores para somar d6 equivalentes ao dano."], ["Terror Noturno", 9, "Feitiço", 2, "Uma vez por descanso longo, alvos Muito Próximos fazem reação (16) ou ficam Horrorizados (Vulneráveis); roube Medo do mestre igual ao nº de Horrorizados e cause esse Medo como dano a cada um, depois descarte-o."], ["Tributo do Anoitecer", 9, "Talento", 1, "Escolha um alvo Distante; sucessos sem dano contra ele acumulam marcadores. Ao causar dano nele, gaste marcadores para somar d12 equivalentes ao dano. Só um alvo por vez."], ["Eclipse", 10, "Feitiço", 2, "Teste (16), uma vez por descanso longo: cria escuridão total em alcance Distante, só visível a você e aliados; ataques contra vocês têm desvantagem. Sucessos com Esperança contra adversários na área os fazem marcar 1 PF. Dura até o mestre gastar 1 Medo ou você sofrer dano grave."], ["Espectro das Trevas", 10, "Feitiço", 1, "Marque 1 PF para ficar Incorpóreo (imune a dano físico, pode atravessar objetos sólidos) até fazer um teste tendo outra criatura como alvo."]], "Sabedoria": [["Rastreador Talentoso", 1, "Talento", 0, "Ao rastrear, gaste Esperança para fazer perguntas ao mestre (direção, tempo, o que faziam, quantos eram); ao encontrar os alvos, +1 na Evasão contra eles."], ["Vinha Voraz", 1, "Feitiço", 1, "Teste contra alvo Distante; sucesso = raízes causam 1d8+1 de dano físico e Imobilizam temporariamente; gaste 1 Esperança para Imobilizar também um adversário Muito Próximo do primeiro."], ["Voz da Natureza", 1, "Talento", 0, "Fale com plantas e animais via teste de Instinto (12); gaste 1 Esperança antes de um teste de conjuração num ambiente natural para +2."], ["Conjurar Enxame", 2, "Feitiço", 1, "Besouros Blindados: marque 1 PF para reduzir a gravidade do próximo dano sofrido em um limiar (gaste 1 Esperança para manter após sofrer dano). Vaga-Lumes: teste contra adversários Próximos, gastando 1 Esperança para causar 2d8+3 de dano mágico."], ["Familiar da Natureza", 2, "Feitiço", 1, "Gaste 1 Esperança para invocar um familiar até seu próximo descanso; gaste mais 1 para um familiar voador. Comande tarefas simples e marque 1 PF para ver pelos olhos dele; dano CaC a ele causa +1d6."], ["Projétil Corrosivo", 3, "Feitiço", 1, "Teste contra alvo Distante causando d6+4 de dano mágico com Proficiência; marque 2+ Fadiga para deixá-lo Corroído permanentemente (-1 na dificuldade por 2 Fadiga gasta, cumulativo)."], ["Tronco Descomunal", 3, "Feitiço", 1, "Uma vez por descanso, conjure um tronco escalável em ponto Próximo (altura até Distante). Marque 1 PF para usá-lo como ataque contra adversários Próximos, causando d8 de dano físico com Proficiência e derrubando-os."], ["Campo Curativo", 4, "Feitiço", 2, "Uma vez por descanso longo, crie um campo de plantas curativas Próximo; você e aliados na área recuperam 1 PV (2 gastando 2 Esperança)."], ["Constrição Mortal", 4, "Feitiço", 1, "Teste contra alvo Próximo: puxe-o para CaC (ou puxe-se a ele); ou o force a marcar 2 Fadiga; ou vinhas atingem tudo entre vocês (reação 13; falha = 3d6+2 de dano físico). Sucesso Imobiliza temporariamente."], ["Fortaleza Selvagem", 5, "Feitiço", 1, "Teste (13): gaste 2 Esperança para criar um domo protetor onde você e um aliado ficam a salvo de/para ataques (ataques contra o domo acertam sempre). O domo tem 3 PV e limiares 15/30."], ["Pele de Espinhos", 5, "Feitiço", 1, "Uma vez por descanso, gaste 1 Esperança para espinhos surgirem; coloque marcadores iguais ao atributo de conjuração. Ao sofrer dano, gaste marcadores e role d6 equivalentes para reduzir o dano; se estiver CaC ao atacante, cause o mesmo dano a ele."], ["Coletor", 6, "Talento", 1, "Como movimento de repouso adicional, role 1d6 para descobrir o que coletou (alimento, relíquia, runa, frasco, talismã ou escolha) — máx. 5 consumíveis no grupo por vez."], ["Conjurar Montarias", 6, "Feitiço", 0, "Gaste Esperança para conjurar montarias que dobram a velocidade de viagem e podem se mover a um ponto Distante sem teste em perigo; sofrem -2 em ataque e +2 em dano enquanto montadas, até dano ou próximo descanso longo."], ["Aspecto Selvagem", 7, "Feitiço", 2, "Uma vez por descanso longo, marque 1 PF para canalizar a natureza; coloque 1d6 (começa em 1) que soma a todos os testes e sobe 1 a cada uso, terminando ao passar de 6 ou num descanso (marque 1 PF adicional)."], ["Dom da Sabedoria", 7, "Talento", 2, "Se 4+ cartas na mão forem da Sabedoria: +2 em testes de conjuração em ambiente natural; uma vez por descanso, dobre Agilidade ou Instinto antes de um teste que use esse atributo."], ["Barreira Revigorante", 8, "Feitiço", 1, "Teste (15), uma vez por descanso: cria barreira Muito Próxima; quem estiver dentro ao conjurar recupera 1d4 PV, e todos dentro têm resistência a dano físico externo. Move-se com você."], ["Espíritos da Floresta", 8, "Feitiço", 2, "Teste (13): gaste Esperança para criar espíritos em pontos Distantes; dão +3 em ataques contra adversários CaC a eles e permitem marcar 1 Ponto de Armadura adicional; desaparecem ao conceder um benefício ou sofrer dano."], ["Santuário Selvagem", 9, "Talento", 2, "Após um descanso longo, coloque marcadores iguais às cartas da Sabedoria na mão e reserva; gaste-os após um teste de conjuração para +1 por marcador. Sucesso crítico da Sabedoria dá um marcador."], ["Soberania Vegetal", 9, "Feitiço", 1, "Teste (18), uma vez por descanso longo: remodele a flora em qualquer ponto Distante — árvores brotando, caminhos abertos, muralhas de raízes, etc."], ["Força da Natureza", 10, "Feitiço", 2, "Marque 1 PF para virar um grande espírito da natureza: +10 no dano ao ter sucesso em ataque/conjuração; ao derrotar alvo Próximo, absorva-o e recupere 1 PA; imune a Imobilizado. Gaste 1 Esperança antes de cada teste ou volte ao normal."], ["Tempestade", 10, "Feitiço", 2, "Escolha Nevasca (2d20+8 mágico, Vulnerável), Furacão (3d10+10 mágico, vento impede movimento contra ele) ou Tempestade de Areia (5d6+9 mágico, desvantagem em ataques à distância); teste contra todos os Distantes, dura até o mestre gastar 1 Medo."]], "Valor": [["Armadura Corporal", 1, "Talento", 0, "Sem armadura equipada, tenha Armadura base 3+Força e limiares por patamar: 9/19, 11/24, 13/31, 15/38."], ["Imposição", 1, "Talento", 0, "Ataque CaC com a arma principal; sucesso empurra a Próximo (com Esperança, +1d6 no dano). Gaste 1 Esperança para deixar o alvo Vulnerável."], ["Sou Seu Escudo", 1, "Talento", 1, "Quando um aliado Muito Próximo for sofrer dano, marque 1 PF para tomar o golpe no lugar dele; ao sofrer, pode marcar Pontos de Armadura à vontade."], ["Força Esmagadora", 2, "Talento", 1, "Ao acertar com arma CaC, receba bônus igual à sua Força na rolagem de dano."], ["Presença Corajosa", 2, "Talento", 0, "Em teste de Presença, gaste 1 Esperança para somar sua Força. Uma vez por descanso, evite sofrer uma condição descrevendo como sua coragem ajuda."], ["Inspiração Crítica", 3, "Talento", 1, "Uma vez por descanso, em sucesso crítico ao atacar, aliados Muito Próximos recuperam 1 PF ou ganham 1 Esperança."], ["Palavras de Conforto", 3, "Talento", 1, "Uma vez por descanso longo, ao consolar/inspirar um aliado que falhou num teste, ambos recuperam 2 PF."], ["Bastião", 4, "Talento", 2, "Quando um aliado Próximo falhar num teste, gaste 2 Esperança para ele rolar de novo o Dado de Medo ou Esperança."], ["Incitar", 4, "Talento", 1, "Provoque um alvo Próximo; teste de Presença — sucesso = ele marca 1 PF e ataca você com desvantagem na próxima vez que for focado."], ["Armeiro", 5, "Talento", 1, "+1 na Armadura enquanto usar armadura. Ao escolher Reparar Armadura em descanso, seus aliados também recuperam 1 Ponto de Armadura."], ["Golpe Inspirador", 5, "Talento", 1, "Uma vez por descanso, em sucesso crítico ao atacar, você e aliados que possam ver/ouvir recuperam 1 PV ou 1d4 de Fadiga."], ["Altivez", 6, "Talento", 2, "Bônus igual à Proficiência no limiar de dano grave; ao marcar 1+ PV num ataque, recupere 1 PF."], ["Inevitável", 6, "Talento", 1, "Ao falhar num teste, seu próximo teste é feito com vantagem."], ["Desprezar Fraqueza", 7, "Talento", 1, "Ao sofrer dano, marque 1 PF para reduzir a gravidade em um limiar. Role 1d6; em 3 ou menos, a carta vai para a reserva."], ["Dom do Bastião", 7, "Talento", 1, "Se 4+ cartas na mão forem do Valor: +1 na Armadura; ao marcar 1+ PV sem marcar Ponto de Armadura, recupere 1 PA."], ["Abalo Sísmico", 8, "Talento", 2, "Gaste 2 Esperança para golpear o solo; teste de Força contra alvos Próximos — empurra a Distante e força reação (17); falha = 4d10+8 de dano, sucesso = metade."], ["Testar os Limites", 8, "Talento", 1, "Uma vez por descanso longo, marque 3 Fadiga para +2 em todos os atributos até seu próximo descanso."], ["Líder Exemplar", 9, "Talento", 3, "Ao causar dano, marque 1 PF e encoraje seus aliados: o próximo personagem que atacar esse alvo recupera 1 PF ou ganha 1 Esperança."], ["Manter Posição", 9, "Talento", 1, "Descreva sua posição defensiva e gaste 1 Esperança; se um adversário se mover a Muito Próximo, é puxado para CaC e Imobilizado até você se mover, errar com Medo, ou o mestre gastar 2 Medo."], ["Armadura Irredutível", 10, "Talento", 1, "Ao marcar Ponto de Armadura, role d6 iguais à Proficiência; um 6 reduz a gravidade em um limiar sem gastar o Ponto de Armadura."], ["Invencível", 10, "Talento", 4, "Ao marcar seu último PV, em vez de um movimento de morte, recupere 1d6 PV; depois a carta vai para a reserva."]], "Pavor": [["Golpe Funesto", 1, "Feitiço", 1, "Faça um teste de conjuração contra um alvo em alcance Distante. Em sucesso: • Em rolagem com Esperança, cause d6+1 de dano mágico usando sua Proficiência. Em rolagem com Medo, cause d10+1 de dano mágico usando sua Proficiência. • O próximo ataque bem-sucedido do alvo causa metade do dano. Em falha, você deve gastar 1 Esperança ou marcar 1 Fadiga."], ["Véu Umbral", 1, "Feitiço", 1, "Uma vez por descanso, você pode marcar 1 Fadiga para se envolver em energia sombria. Ao fazer isso, coloque nesta carta marcadores iguais ao número de Medo na reserva do mestre. Depois que uma rolagem de ataque for feita contra você, pode gastar qualquer quantidade de marcadores para dar ao resultado uma penalidade de −1 por marcador gasto. No fim da cena, remova todos os marcadores não gastos."], ["Voz do Pavor", 1, "Feitiço", 0, "Você pode falar magicamente com uma criatura que consiga ver, atormentando-a com suas palavras. Faça um teste de conjuração contra ela. Em sucesso, ela deve marcar 1 Fadiga e fica paralisada de terror, ficando temporariamente Imobilizada."], ["Retribuição Hedionda", 2, "Feitiço", 2, "Quando um aliado em alcance Próximo sofrer dano de um alvo que você consiga ver, você pode fazer um teste de reação contra o alvo usando seu atributo de conjuração. Em sucesso, marque 1 Fadiga para causar d6 de dano mágico usando sua Proficiência."], ["Sifão de Essência", 2, "Feitiço", 1, "Faça um teste de conjuração contra um alvo em alcance Muito Próximo. Uma vez por descanso longo, em sucesso, o alvo sofre d12+4 de dano mágico usando sua Proficiência. Em sucesso com Medo, você recebe +1 de Proficiência neste ataque. Você recupera uma quantidade de Pontos de Vida igual aos Pontos de Vida que o alvo marcou neste ataque."], ["Trauma Compartilhado", 3, "Feitiço", 1, "Você pode transferir sofrimento de uma criatura para outra. Uma vez por descanso, marque qualquer quantidade de Pontos de Vida em uma criatura voluntária em alcance Corpo a Corpo para recuperar igual quantidade de Pontos de Vida de outra criatura voluntária em alcance Corpo a Corpo."], ["Aterrorizar", 3, "Feitiço", 1, "Faça um teste de conjuração contra um alvo em alcance Próximo. Em sucesso, o alvo marca 1d4 Fadiga e você pode fazê-lo fugir um alcance para longe de você (por exemplo, de Muito Próximo para Próximo ou de Próximo para Distante). Em sucesso com Medo, o alvo também fica temporariamente Vulnerável."], ["Invocar Horror", 4, "Feitiço", 2, "Marque 1 Fadiga para invocar uma criatura de outro mundo que causa d8+1 de dano mágico, usando seu atributo de conjuração, a um alvo em alcance Distante. Se o alvo marcar qualquer Ponto de Vida neste ataque, ele deve ter sucesso em um teste de reação (12) para resistir ao horror ou marcar igual quantidade de Fadiga. Depois do ataque, a criatura se dissipa."], ["Correntes da Aflição", 4, "Feitiço", 2, "Marque 2 Fadiga para Acorrentar temporariamente um alvo em alcance Próximo. Quando uma criatura Acorrentada causar dano, o alvo do ataque dela marca 1 Ponto de Vida a menos do que normalmente marcaria. Você não pode ter mais de uma criatura Acorrentada por vez."], ["Golpe Sinistro", 5, "Feitiço", 2, "Quando um alvo marcar qualquer quantidade de Pontos de Vida por um ataque seu, você pode gastar 1 Esperança para drenar o poder dele. O mestre perde 1 Medo."], ["Névoa Espectral", 5, "Feitiço", 0, "Gaste 2 Esperança para conjurar uma névoa sinistra que torna você e aliados à sua escolha em alcance Próximo momentaneamente incorpóreos. Enquanto uma criatura estiver incorpórea, ela pode atravessar objetos sólidos e é imune a dano físico. Ela volta a ser corpórea depois de atravessar um objeto sólido ou fazer uma rolagem de ação. Caso contrário, o efeito dura até o fim da cena."], ["Fogo Negro", 6, "Feitiço", 2, "Gaste qualquer quantidade de Esperança para escolher igual número de adversários em alcance Próximo. Cada alvo faz um teste de reação (15). Alvos que falharem sofrem d8+6 de dano mágico, usando seu atributo de conjuração, envoltos em fogo negro. Alvos que passarem sofrem metade do dano."], ["Susto", 6, "Feitiço", 1, "Quando causar dano mágico a um alvo, você pode marcar 1 Fadiga para se teleportar para alcance Corpo a Corpo dele. Ao fazer isso, ele fica Vulnerável até marcar 1 ou mais Pontos de Vida."], ["Tocado pelo Pavor", 7, "Talento", 2, "Quando 4 ou mais cartas de domínio do seu loadout forem do domínio Pavor, você ganha estes benefícios: • Ao ter sucesso com Medo, você pode marcar 2 Fadiga para impedir o mestre de ganhar 1 Medo. • Uma vez por descanso, ao fazer uma rolagem de ação, você pode receber um bônus na rolagem igual ao número de Medo na reserva do mestre."], ["Muralha da Fome", 7, "Feitiço", 2, "Faça um teste de conjuração (10). Em sucesso, você pode gastar 1 Esperança para criar uma muralha visível de energia necrótica pulsante entre dois pontos em alcance Distante. A muralha dura até você marcar um Ponto de Vida ou conjurar esta magia de novo. Uma criatura dentro da muralha quando ela surgir, ou que a atravessar, deve marcar 2 Fadiga."], ["Exército Sombrio", 8, "Feitiço", 2, "Faça um teste de conjuração (14). Uma vez por descanso longo, em sucesso, você pode invocar demônios que cercam e acompanham você. Coloque 8 marcadores nesta carta. Ao causar dano a um alvo em alcance Muito Próximo, você pode gastar qualquer quantidade de marcadores para somar 1d8 por marcador gasto à rolagem de dano. Além disso, ao sofrer dano, pode gastar qualquer quantidade de marcadores para reduzir o dano em 1d8 por marcador gasto. A cada marcador gasto, um demônio age em seu favor e então desaparece. Ao descansar, remova todos os marcadores não gastos."], ["Carne Sobrenatural", 8, "Feitiço", 1, "Receba +1 nos limiares de dano para cada Fadiga que tiver marcada. Além disso, ao rolar com Medo, você pode gastar 2 Esperança para recuperar 1 Ponto de Armadura."], ["Danação", 9, "Feitiço", 2, "Faça um teste de conjuração contra um alvo em alcance Distante. Em sucesso, marque qualquer quantidade de Fadiga para rolar igual número de d20, causando dano mágico igual ao resultado total. Se o ataque derrotar o alvo, t function rolarDualidade(autor, rotulo, mod, extra, vantagem){
  const esperanca=d(12), medo=d(12);
  const vd = vantagem!==0 ? d(6) : 0;
  const bonusV = vantagem>0? vd : vantagem<0? -vd : 0;
  const total = esperanca+medo+mod+extra+bonusV;
  const critico = esperanca===medo;
  const resultado = critico? 'critico' : (esperanca>medo? 'esperanca':'medo');
  return {id:uid(), ts:Date.now(), tipo:'dualidade', autor, rotulo, esperanca, medo,
          mod:mod+extra, vantagem, vd, total, resultado};
}
function aplicarGanhosDualidade(f, resultado){
  // Regras (p.98 do livro): em sucesso crítico, o personagem recebe 1 Ponto de
  // Esperança E recupera 1 Ponto de Fadiga; em qualquer resultado "com Esperança"
  // (sucesso ou falha), recebe 1 Ponto de Esperança. "Com Medo" não mexe na ficha
  // do jogador — o mestre é quem ganha 1 Ponto de Medo (já tratado em registrarRolagem).
  const max = Math.max(0, 6-(f.cicatrizes||0));
  if(resultado==='critico'){
    f.esperanca = Math.min(max, (f.esperanca||0)+1);
    f.pf = Math.max(0, (f.pf||0)-1);
    salvarUmaFicha(f, true);
  } else if(resultado==='esperanca'){
    f.esperanca = Math.min(max, (f.esperanca||0)+1);
    salvarUmaFicha(f, true);
  }
}
function rollRowHTML(r){
  if(r.tipo==='dualidade'){
    const cor = r.resultado==='critico'? 'var(--seal)' : r.resultado==='esperanca'? 'var(--hope)' : 'var(--fear)';
    const lab = r.resultado==='critico'? 'Sucesso crítico' : r.resultado==='esperanca'? 'com Esperança' : 'com Medo';
    return `<div class="rollrow">
      <div class="top"><span class="name">${esc(r.autor)} · ${esc(r.rotulo)}</span><span class="time">${hora(r.ts)}</span></div>
      <div class="meta">
        <span class="tagHope">Esperança ${r.esperanca}</span>
        <span class="tagFear">Medo ${r.medo}</span>
        ${r.mod? `<span class="muted">${sgn(r.mod)}</span>`:''}
        ${r.vantagem!==0? `<span class="muted">${r.vantagem>0?'vantagem':'desvantagem'} d6: ${r.vd}</span>`:''}
        <span class="rtotal" style="color:${cor}">${r.total} — ${lab}</span>
      </div></div>`;
  }
  return `<div class="rollrow">
    <div class="top"><span class="name">${r.autor? esc(r.autor)+' · ':''}${esc(r.rotulo)}</span><span class="time">${hora(r.ts)}</span></div>
    <div class="meta"><span class="muted">[${r.dados.join(', ')}]${r.mod? ' '+sgn(r.mod):''}</span>
    <span class="rtotal" style="color:var(--hope)">${r.total}</span></div></div>`;
}
function dominiosDaClasse(classe){
  const c = CLASSES[classe]; if(!c) return [];
  return c.dominios.split('&').map(s=>s.trim());
}
function dominiosDoPersonagem(f){
  const base = dominiosDaClasse(f.classe);
  if(f.multiclasse && f.multiclasse.dominio && !base.includes(f.multiclasse.dominio)) return [...base, f.multiclasse.dominio];
  return base;
}
function dominiosParaLevelUp(f, lu){
  let doms = dominiosDoPersonagem(f);
  const mc = lu.escolhas.find(e=>e.tipo==='multiclasse');
  if(mc && !doms.includes(mc.multiclasse.dominio)) doms = [...doms, mc.multiclasse.dominio];
  return doms;
}
function dominioDeMulticlasse(f, lu){
  if(f.multiclasse) return f.multiclasse.dominio;
  const mc = lu && lu.escolhas && lu.escolhas.find(e=>e.tipo==='multiclasse');
  return mc ? mc.multiclasse.dominio : null;
}
function tetoCartaDominio(dominio, nivelPersonagem, dominioMulticlasse, tetoBase){
  let teto = (tetoBase===null || tetoBase===undefined) ? nivelPersonagem : Math.min(tetoBase, nivelPersonagem);
  if(dominioMulticlasse && dominio===dominioMulticlasse){
    teto = Math.min(teto, Math.ceil(nivelPersonagem/2));
  }
  return teto;
}
function atributosValidos(atr){
  const vals = Object.values(atr).slice().sort((a,b)=>a-b);
  const alvo = [-1,0,0,1,1,2];
  return JSON.stringify(vals)===JSON.stringify(alvo);
}
function limiaresCalculados(f){
  const nivel = Number(f.nivel)||1;
  return {
    maior: (Number(f.limiarMaiorBase)||0) + nivel + (Number(f.limiarBonusMaior)||0),
    grave: (Number(f.limiarGraveBase)||0) + nivel + (Number(f.limiarBonusGrave)||0)
  };
}
function getAncestralidadeHabs(f){
  if(f.ancestralidadeMista) return f.ancestralidadeMista.habilidades;
  const info = ANCESTRALIDADES_INFO[f.ancestralidade];
  return info ? info.habilidades : null;
}
function tierDoNivel(nivel){
  if(nivel<=1) return 1;
  if(nivel<=4) return 2;
  if(nivel<=7) return 3;
  return 4;
}
function opcoesDisponiveisEm(f, tierAtual){
  // lista cada opção de cada patamar (do 2 até o atual) que ainda tenha caixas livres
  const lista = [];
  for(let t=2; t<=tierAtual; t++){
    (PROGRESSAO_OPCOES[t]||[]).forEach(op=>{
      if(op.tipo==='multiclasse' && f.multiclasse) return; // já fez multiclasse na carreira
      if(op.tipo==='subclasse' && !f.subclasseId) return; // sem subclasse escolhida, nada pra aprimorar
      if(op.tipo==='subclasse' && (f.subclasseTier||0)>=2) return; // já tem a carta de maestria
      if(boxesRestantes(f, t, op.id) > 0) lista.push({...op, origemTier:t});
    });
  }
  return lista;
}
function boxesRestantes(f, tier, opId){
  const def = (PROGRESSAO_OPCOES[tier]||[]).find(o=>o.id===opId);
  if(!def) return 0;
  const usados = (f.avancos[tier] && f.avancos[tier][opId]) || 0;
  return Math.max(0, def.boxes - usados);
}

function lerImagemRedimensionada(file, maxW, qualidade, callback){
  const reader = new FileReader();
  reader.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const cv = document.createElement('canvas');
      const w = Math.min(maxW, im.width);
      cv.width = w; cv.height = Math.round(im.height/im.width*w);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      callback(cv.toDataURL('image/jpeg', qualidade));
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}

const TESOURO_TABELA = [[1, "Saco de Dormir de Qualidade", "Durante o repouso, você automaticamente recupera 1 Ponto de Fadiga."], [2, "Apito-flauta", "Este apito artesanal tem um som bastante marcante. Quando assoprado, seu timbre estridente pode ser ouvido em um raio de 1 km e meio."], [3, "Aljava de Carga", "Quando acertar um ataque feito com uma flecha que estava nesta aljava, você recebe um bônus na rolagem de dano igual ao seu patamar."], [4, "Tocha de Alistair", "Você pode acender esta tocha mágica sempre que desejar. A luz das chamas preenche um espaço muito maior do que deveria, o suficiente para iluminar uma caverna como se fosse dia."], [5, "Orbes da Comunicação", "Criaturas segurando esse par de orbes podem se comunicar independentemente da distância que estejam uma da outra."], [6, "Algemas", "Um par de algemas com uma chave."], [7, "Capa Arcana", "Se tiver um atributo de conjuração, a criatura usando esta capa pode ajustar sua cor, textura e tamanho."], [8, "Rede Trançada", "Você pode fazer um teste de precisão usando esta rede para prender uma criatura pequena. Um alvo preso pode escapar passando em um teste de ataque (16)."], [9, "Jarro de Fogo", "Derramar o líquido estranho deste jarro produz fogo imediatamente. Ele recarrega a cada descanso longo."], [10, "Cajado Suspenso", "Este cajado achatado está entalhado com runas. Quando ativado, fica imediatamente suspenso no ar; até ser desativado, não faz o menor movimento, não respeita as regras da realidade e não sai do lugar."], [11, "Pedra do Glamour", "Use esta pedra pequena para gravar a aparência de uma pessoa que você pode ver. Gaste 1 Ponto de Esperança para, como uma ilusão, recriar essa aparência magicamente em seu corpo."], [12, "Baú Vazio", "Este baú mágico aparenta estar vazio. Após dizer uma palavra ou ação específica para abrir o baú, você consegue ver os objetos armazenados nele."], [13, "Caixinha do Companheiro", "Esta caixinha pode abrigar um companheiro animal pequeno. Enquanto o compa ar o valor máximo em um dado de dano, role +1 dado de dano."], [26, "Pedra do Poder", "Incruste esta pedra em uma arma que ainda não tem uma habilidade; ela recebe: Poderosa — ao acertar um ataque, role +1 dado de dano e descarte o de resultado mais baixo."], [27, "Paraquedas", "Quando estiver caindo, marque 1 Ponto de Fadiga para usar este item e planar em segurança até o chão."], [28, "Anel do Silêncio", "Gaste 1 Ponto de Esperança para ativar este anel. Seus passos não emitem sons até seu próximo descanso."], [29, "Pingente Tranquilizante", "Quando estiver prestes a marcar sua última Fadiga, role 1d6. Se rolar 5 ou mais, você não precisa marcá-la."], [30, "Frasco Duplo", "Este frasco pode conter dois líquidos diferentes. Alterne entre eles ativando um pequeno interruptor lateral."], [31, "Bolsa de Areia Errática", "Com sucesso em Presença (10), você convence esta bolsa a ser mais pesada ou leve. Passando em Acuidade (10), sopra areia no rosto de um alvo para deixá-lo temporariamente Vulnerável."], [32, "Anel da Resistência", "Uma vez por descanso longo, ative este anel após ser atingido por um ataque para reduzir o dano à metade."], [33, "Pena de Fênix", "Se tiver ao menos uma Pena de Fênix consigo quando ficar inconsciente, recebe +1 no teste que determina se fica com uma cicatriz."], [34, "Caixa das Muitas Posses", "Uma vez por descanso longo, abra esta caixa e role 1d12: 1–6 vazia; 7–10 um consumível comum aleatório; 11–12 dois consumíveis comuns aleatórios."], [35, "Amuleto do Alcance", "Você pode anexar este amuleto a uma arma de alcance Corpo a Corpo. 3 vezes por descanso, ative-o para atacar um alvo Próximo."], [36, "Semente de Portal", "Plante esta semente no chão para que um portal surja no local em 24h; use-o para viajar até qualquer outro lugar onde tenha plantado uma Semente de Portal. Destruído se sofrer dano mágico."], [37, "Corrente dos Princípios", "Como movimento de repouso, medite sobre um ideal ou princípio importante, focando sua força de vont const App = {};
function mundoEncontrarItem(id, lista){
  for(const item of lista){
    if(item.id===id) return item;
    if(item.tipo==='pasta'){ const f = mundoEncontrarItem(id, item.itens); if(f) return f; }
  }
  return null;
}
function mundoEncontrarListaPai(id, lista){
  if(lista.some(x=>x.id===id)) return lista;
  for(const item of lista){
    if(item.tipo==='pasta'){ const f = mundoEncontrarListaPai(id, item.itens); if(f) return f; }
  }
  return null;
}
App.mundoToggleExpandir = (id)=>{ state.mundoExpandido[id] = !state.mundoExpandido[id]; render(); };
App.mundoSelecionarArquivo = (id)=>{ state.mundoAbrindoId = id; render(); };
App.mundoRenomearTab = ()=>{
  const nome = prompt('Nome da aba:', state.campanha.mundo.nome);
  if(!nome) return;
  state.campanha.mundo.nome = nome;
  render(); salvarCampanha();
};
App.mundoCriarPasta = (parentId)=>{
  const nome = prompt('Nome da pasta:');
  if(!nome) return;
  const pai = parentId? mundoEncontrarItem(parentId, state.campanha.mundo.itens) : null;
  const lista = pai? pai.itens : state.campanha.mundo.itens;
  lista.push(novaPastaMundo(nome));
  if(parentId) state.mundoExpandido[parentId] = true;
  render(); salvarCampanha();
};
App.mundoCriarArquivo = (parentId)=>{
  const nome = prompt('Nome do arquivo:') || 'Novo Arquivo';
  const pai = parentId? mundoEncontrarItem(parentId, state.campanha.mundo.itens) : null;
  const lista = pai? pai.itens : state.campanha.mundo.itens;
  const arq = novoArquivoMundo(nome);
  lista.push(arq);
  if(parentId) state.mundoExpandido[parentId] = true;
  state.mundoAbrindoId = arq.id;
  state.editPaineis['mundoArquivo:'+arq.id] = true;
  render(); salvarCampanha();
};
App.mundoRenomearItem = (id)=>{
  const item = mundoEncontrarItem(id, state.campanha.mundo.itens); if(!item) return;
  const nome = prompt('Novo nome:', item.nome);
  if(!nome) return;
  item.nome = nome;
  render(); salvarCampanha();
};
App.mundoExcluirItem = (id)=>{
  if(!confirm('Excluir isto? Se for uma pasta, tudo dentro dela também será excluído.')) return;
  const lista = mundoEncontrarListaPai(id, state.campanha.mundo.itens);
  if(lista){ const idx = lista.findIndex(x=>x.id===id); if(idx>=0) lista.splice(idx,1); }
  if(state.mundoAbrindoId===id) state.mundoAbrindoId = null;
  render(); salvarCampanha();
};
App.mundoArquivoCampo = (id, campo, val)=>{
  // Sem render() aqui de propósito: o campo já mostra o que foi digitado sozinho
  // (é um <input>/<textarea> do próprio navegador); redesenhar a cada tecla
  // destruiria o elemento e tiraria o foco dele.
  const item = mundoEncontrarItem(id, state.campanha.mundo.itens); if(!item) return;
  item[campo] = val;
  agendarSalvarCampanha();
};
App.mundoToggleMapa = (id)=>{

};

App.abrirConfigFirebase = ()=>{ state.err=''; state.screen='config-firebase'; render(); };
App.salvarConfigFirebase = ()=>{
  const txt = document.getElementById('configFirebaseTxt').value.trim();
  state.err='';
  let cfg;
  try{
    cfg = JSON.parse(txt);
  }catch(e){
    state.err = 'Não consegui ler essa configuração. Confira se colou o objeto JSON certinho (com chaves e aspas).';
    return render();
  }
  if(!cfg.apiKey || !cfg.projectId){
    state.err = 'Esse objeto parece incompleto — confira se tem pelo menos "apiKey" e "projectId".';
    return render();
  }
  localStorage.setItem('dh:firebase-config', JSON.stringify(cfg));
  FIREBASE_CONFIG = cfg;
  firebaseApp = null; authFB = null; dbFB = null;
  iniciarFirebase();
  state.screen = 'login';
  render();
};

function traduzErroFirebase(e){
  const c = (e && e.code) || '';
  const mapa = {
    'auth/email-already-in-use': 'Esse e-mail já tem uma conta. Tente entrar em vez de criar.',
    'auth/invalid-email': 'Esse e-mail não parece válido.',
    'auth/weak-password': 'A senha precisa de pelo menos 6 caracteres.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'Não encontramos essa conta. Crie uma conta para começar.',
    'auth/too-many-requests': 'Muitas tentativas seguidas. Espere um pouco e tente de novo.',
    'auth/network-request-failed': 'Falha de conexão. Confira sua internet.'
  };
  return mapa[c] || (e && e.message) || 'Algo deu errado. Tente de novo.';
}
App.login = async ()=>{
  if(!firebaseConfigurado()){ state.err='Configure o Firebase antes de entrar.'; return render(); }
  const email = document.getElementById('inEmail').value.trim();
  const senha = document.getElementById('inPass').value;
  const nomeEl = document.getElementById('inNome');
  const nome = nomeEl? nomeEl.value.trim() : '';
  const p2raw = document.getElementById('inPass2');
  const senha2 = p2raw? p2raw.value : '';
  state.err='';
  if(!email || !senha){ state.err='Preencha e-mail e senha.'; return render(); }
  try{
    if(state.loginModo==='criar'){
      if(!nome){ state.err='Escolha um nome de exibição.'; return render(); }
      if(senha.length<6){ state.err='A senha precisa de pelo menos 6 caracteres.'; return render(); }
      if(senha!==senha2){ state.err='As senhas não são iguais.'; return render(); }
      const existente = await DB.get(K.user(nome));
      if(existente){ state.err='Esse nome de exibição já está em uso.'; return render(); }
      const cred = await authFB.createUserWithEmailAndPassword(email, senha);
      await cred.user.updateProfile({ displayName: nome });
      const novo = {nome, uid:cred.user.uid, email, criado:Date.now(), campanhas:[]};
      await DB.set(K.user(nome), novo);
      state.usuario = novo; state.screen='home';
      await recarregarCampanhasHome(); return render();

function levelUpSlotsUsados(){
  return state.levelUp.escolhas.reduce((a,e)=>a+e.slots,0);
}
App.levelUpConfigurar = (tier, id)=>{
  const restantes = 2 - levelUpSlotsUsados();
  const def = (PROGRESSAO_OPCOES[tier]||[]).find(o=>o.id===id);
  if(def.bold && restantes<2){ alert('Essa opção usa as duas escolhas do nível de uma vez — você já usou uma escolha.'); return; }
  state.levelUp.tempAtributos=[]; state.levelUp.tempExp=[]; state.levelUp.tempDominio=''; state.levelUp.tempMulticlasseClasse=''; state.levelUp.tempMulticlasseDominio='';
  // opções sem sub-configuração são aplicadas direto
  if(['pv','pf','evasao','proficiencia'].includes(def.tipo)){
    state.levelUp.escolhas.push({tier, id, tipo:def.tipo, slots: def.bold?2:1, label: def.nome});
    render(); return;
  }
  if(def.tipo==='subclasse'){
    const f = getFicha(state.levelUp.fichaId);
    const s = SUBCLASSES[f.classe] && SUBCLASSES[f.classe][f.subclasseId];
    const proxima = (f.subclasseTier||0)===0 ? 'Especialização' : 'Maestria';
    state.levelUp.escolhas.push({tier, id, tipo:def.tipo, slots:1, label:`${def.nome} (${proxima})`});
    render(); return;
  }
  state.levelUp.configurando = {tier, id, tipo:def.tipo, def};
  render();
};

App.levelUpFinalizar = async ()=>{
  const lu = state.levelUp;
  const f = getFicha(lu.fichaId);
  f.nivel = lu.novoNivel;
  if(lu.isTierUp){
    if(!lu.conquistaExpNome.trim()){ alert('Dê um nome à Experiência da conquista deste patamar.'); return; }
    f.experiencias.push({id:uid(), nome:lu.conquistaExpNome.trim(), mod:2});
    f.proficiencia = (Number(f.proficiencia)||1) + 1;
    if(lu.novoNivel===5 || lu.novoNivel===8) f.atributosTravados = [];
  }
  lu.escolhas.forEach(e=>{
    if(!f.avancos[e.tier]) f.avancos[e.tier] = {};
    const def = (PROGRESSAO_OPCOES[e.tier]||[]).find(o=>o.id===e.id);
    f.avancos[e.tier][e.id] = (def && def.bold) ? def.boxes : ((f.avancos[e.tier][e.id]||0) + 1);
    if(e.tipo==='pv') f.pvMax += 1;
    else if(e.tipo==='pf') f.pfMax += 1;
    else if(e.tipo==='evasao') f.evasao += 1;
    else if(e.tipo==='proficiencia') f.proficiencia = (Number(f.proficiencia)||1) + 1;
    else if(e.tipo==='exp'){
      e.expIds.forEach(id=>{ const exp = f.experiencias.find(x=>x.id===id); if(exp) exp.mod = (Number(exp.mod)||0)+1; });
    } else if(e.tipo==='atributos'){
      e.atributos.forEach(k=>{ f.atributos[k] = (Number(f.atributos[k])||0)+1; });
      f.atributosTravados = [...new Set([...f.atributosTravados, ...e.atributos])];
    } else if(e.tipo==='dominio'){
      const [dom,nome] = e.dominioKey.split('|');
      if((f.mao||[]).length<5) f.mao = [...(f.mao||[]), e.dominioKey];
      else f.reserva = [...(f.reserva||[]), e.dominioKey];
    } else if(e.tipo==='subclasse'){
      f.subclasseTier = Math.min(2, (f.subclasseTier||0)+1);
    } else if(e.tipo==='multiclasse'){
      f.multiclasse = { classe: e.multiclasse.classe, dominio: e.multiclasse.dominio, tier: e.tier };
    }
  });
  if(lu.cartaObrigatoria){
    if((f.mao||[]).length<5) f.mao = [...(f.mao||[]), lu.cartaObrigatoria];
    else f.reserva = [...(f.reserva||[]), lu.cartaObrigatoria];
  }
  await salvarUmaFicha(f, true);
  state.levelUp = null;
  render();
};

async function salvarUmaFicha(f, semRender){
  // Atualização otimista: aplica localmente e redesenha JÁ; a escrita no
  // Firestore acontece em paralelo, sem travar a interface esperando a rede.
  const idx = state.fichas.findIndex(x=>x.id===f.id);
  if(idx>=0) state.fichas[idx]=f; else state.fichas.push(f);
  if(!semRender) render();
  await DB.set(K.sheets(state.campanha.codigo), state.fichas);
}
let rollToastTimer = null;
function mostrarRollToast(r){
  let cor = 'var(--hope)', label = r.rotulo||'Rolagem';
  if(r.tipo==='dualidade'){
    if(r.resultado==='critico'){ cor='var(--seal)'; label='Sucesso Crítico'; }
    else if(r.resultado==='esperanca'){ cor='var(--hope)'; label='Com Esperança'; }
    else { cor='var(--fear)'; label='Com Medo'; }
  }
  state.rollToast = { total: r.total, cor, label, autor: r.autor, rotulo: r.rotulo };
  clearTimeout(rollToastTimer);
  rollToastTimer = setTimeout(()=>{ state.rollToast = null; render(); }, 2800);
}
async function registrarRolagem(r){
  r.autor = r.autor || state.usuario.nome;
  state.rolagens = [r, ...state.rolagens].slice(0,80);
  if(r.tipo==='dualidade' && r.resultado==='medo' && state.campanha){
    state.campanha.medo = Math.min(12, (state.campanha.medo||0) + 1);
    salvarCampanha();
  }
  mostrarRollToast(r);
  render();
  await DB.set(K.rolls(state.campanha.codigo), state.rolagens);
}

App._morteEvitarResolver = async (fichaId)=>{
  const f = getFicha(fichaId);
  const dado = d(12);
  const nivel = Number(f.nivel)||1;
  let texto = `Dado de Esperança: ${dado}. `;
  let cicatriz = false;
  if(dado <= nivel){
    cicatriz = true;
    f.cicatrizes = (f.cicatrizes||0)+1;
    const novoMax = Math.max(0, 6-f.cicatrizes);
    if(f.esperanca > novoMax) f.esperanca = novoMax;
    texto += `Igual ou menor que o nível (${nivel}) — o personagem sofre uma cicatriz: uma casa de Esperança é riscada permanentemente.`;
    if(f.cicatrizes>=6) texto += ' Todas as casas de Esperança foram riscadas: é hora de encerrar a jornada deste personagem.';
  } else {
    texto += `Maior que o nível (${nivel}) — o personagem evita a cicatriz desta vez.`;
  }
  texto += ' O personagem fica inconsciente: não pode se mover, agir, ou ser alvo de ataques, até recuperar 1+ Ponto de Vida ou até o próximo descanso longo do grupo.';
  f.status = 'inconsciente';
  await salvarUmaFicha(f, true);
  state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: dado, corDado: cicatriz?'var(--fear)':'var(--hope)' };
  render();
};
