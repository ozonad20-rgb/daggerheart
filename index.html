    background-attachment:fixed,fixed,fixed,fixed;}
  #app{min-height:100vh;}
  input,select,textarea{font-family:var(--sans);}
  a{color:inherit;}
  button{font-family:var(--sans);cursor:pointer;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--hope); outline-offset:2px;
  }
  .wrap{max-width:1150px;margin:0 auto;padding:0 20px;}
  .wrap-sm{max-width:440px;margin:0 auto;padding:0 20px;}

  .btn{border-radius:9px;border:1px solid var(--line2);background:var(--ink3);color:var(--parch);
       padding:13px 20px;font-size:1rem;font-weight:700;letter-spacing:.01em;transition:filter .15s;min-height:46px;}
  .btn:hover{filter:brightness(1.2);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-sm{padding:9px 14px;font-size:.9rem;min-height:38px;}
  .btn-gold{background:var(--hope);border-color:var(--hope);color:var(--hope-ink);}
  .btn-purple{background:var(--fear);border-color:var(--fear);color:#180E2E;}
  .btn-danger{background:transparent;border-color:var(--blood);color:var(--blood);}
  .btn-ghost{background:transparent;border-color:var(--line2);color:var(--parch2);}
  .btn-block{width:100%;display:block;}

  .field label,.lbl{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field select,.field textarea,.inp{
    width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--line2);
    background:var(--field);color:var(--parch);font-size:1rem;outline:none;min-height:46px;
  }
  .field textarea{line-height:1.55;resize:vertical;min-height:unset;}
  .field{margin-bottom:0;}

  .panel{background:var(--ink2);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
              padding:16px 20px;border-bottom:1px solid var(--line);}
  .panel-head h3{font-family:var(--display);font-size:1.5rem;margin:0;font-weight:500;color:var(--parch);letter-spacing:.01em;}
  .panel-body{padding:20px;}

  .grid{display:grid;gap:14px;}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:760px){ .g3,.g4,.g6{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:460px){ .g2,.g3,.g4,.g6{grid-template-columns:1fr;} }
  .cols2{display:grid;gap:22px;grid-template-columns:1fr;}
  @media (min-width:1000px){ .cols2{grid-template-columns:1fr 1fr;} }

  .cover{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--field);
         aspect-ratio:16/9;position:relative;
         display:flex;align-items:center;justify-content:center;color:var(--line2);font-family:var(--serif);font-size:2rem;}
  .cover.short{aspect-ratio:16/5;}
  .cover img, .portrait img, .cardtile-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;}

  .portrait{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--field);
         aspect-ratio:3/4;position:relative;
         display:flex;align-items:center;justify-content:center;color:var(--line2);font-family:var(--serif);font-size:1.6rem;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab{padding:14px 18px;font-size:1rem;font-weight:700;color:var(--muted);background:none;border:none;
       border-bottom:3px solid transparent;white-space:nowrap;min-height:48px;}
  .tab.active{color:var(--hope);border-color:var(--hope);}

  .pips{display:flex;flex-wrap:wrap;gap:7px;}
  .pip{width:30px;height:30px;border-radius:6px;border:2px solid var(--line2);background:transparent;}
  .pip.on{border-color:transparent;}

  .card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  .rollrow{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--field);margin-bottom:10px;}
  .rollrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rollrow .name{font-family:var(--serif);font-size:1.1rem;color:var(--parch);}
  .rollrow .time{font-size:.85rem;color:var(--muted);}
  .rollrow .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem;margin-top:8px;}
  .tagHope{background:rgba(232,181,79,.22);color:var(--hope);padding:5px 10px;border-radius:6px;font-weight:700;}
  .tagFear{background:rgba(155,123,212,.26);color:var(--fear);padding:5px 10px;border-radius:6px;font-weight:700;}
  .rtotal{margin-left:auto;font-weight:800;font-size:1.3rem;}

  /* Balão de rolagens: overlay fixo no canto inferior esquerdo, sempre visível */
  .bubble{position:fixed;bottom:20px;left:20px;z-index:60;}
  .bubble-closed{width:120px;height:120px;border-radius:18px;border:2px solid var(--hope);background:var(--ink3);
                 display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .bubble-closed .num{font-family:var(--serif);font-size:2.6rem;color:var(--hope);line-height:1;}
  .bubble-closed .lab{font-size:.85rem;color:var(--parch);margin-top:6px;font-weight:700;}
  .bubble-open{width:400px;max-width:calc(100vw - 32px);max-height:75vh;display:flex;flex-direction:column;
               background:var(--ink2);border:2px solid var(--hope);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);}
  .bubble-open header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);}
  .bubble-open header span{font-family:var(--serif);font-size:1.2rem;color:var(--parch);}
  .bubble-open .log{padding:16px;overflow-y:auto;}
  .bubble-open .roller{padding:16px;border-bottom:1px solid var(--line);}
  @media (max-width:480px){
    .bubble{bottom:12px;left:12px;}
    .bubble-closed{width:92px;height:92px;border-radius:14px;}
    .bubble-closed .num{font-size:2rem;}
    .bubble-open{width:calc(100vw - 24px);}
  }

  .modal-bg{position:fixed;inset:0;z-index:70;background:rgba(10,7,20,.88);display:flex;align-items:center;justify-content:center;padding:16px;}

  .roll-toast-wrap{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .roll-toast{text-align:center;animation:rollToastAnim 2.8s cubic-bezier(.2,.8,.25,1) forwards;}
  @keyframes rollToastAnim{
    0%{opacity:0;transform:translateY(50px) scale(.85);}
    14%{opacity:1;transform:translateY(0) scale(1);}
    78%{opacity:1;transform:translateY(-14px) scale(1);}
    100%{opacity:0;transform:translateY(-46px) scale(.96);}
  }
  .roll-toast-num{font-family:var(--display);font-weight:600;font-size:min(9rem,28vw);line-height:1;
    text-shadow:0 0 40px currentColor,0 6px 24px rgba(0,0,0,.6);}
  .roll-toast-label{font-family:var(--sc);font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--parch);text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .roll-toast-by{font-size:1rem;color:var(--muted);margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .mundo-layout{display:flex;min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--ink2);}
  .mundo-sidebar{width:260px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--ink3);}
  .mundo-sidebar-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:14px 10px 10px;}
  .mundo-tree-scroll{flex:1;overflow-y:auto;padding:2px 6px 16px;}
  .mundo-tree-row{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:6px;cursor:pointer;font-size:.86rem;color:var(--parch);}
  .mundo-tree-row:hover{background:rgba(232,181,79,.09);}
  .mundo-tree-row.ativo{background:rgba(232,181,79,.18);color:var(--hope);}
  .mundo-tree-caret{width:11px;flex:none;color:var(--muted);font-size:.65rem;}
  .mundo-tree-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mundo-tree-actions{display:none;gap:1px;flex:none;}
  .mundo-tree-row:hover .mundo-tree-actions{display:flex;}
  .mundo-tree-actions button{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:3px;border-radius:4px;display:flex;}
  .mundo-tree-actions button:hover{color:var(--hope);background:rgba(232,181,79,.18);}
  .mundo-main{flex:1;min-width:0;padding:22px;overflow-y:auto;}
  .mundo-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;color:var(--muted);gap:10px;text-align:center;padding:40px;}
  @media (max-width: 760px){
    .mundo-layout{flex-direction:column;min-height:0;}
    .mundo-sidebar{width:100%;max-height:240px;border-right:none;border-bottom:1px solid var(--line);}
  }
  .mundo-tile{position:relative;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s;}
  .mundo-tile:hover{border-color:var(--hope);}
  .mundo-tile-icon{width:100%;height:60px;display:flex;align-items:center;justify-content:center;color:var(--hope);margin-bottom:8px;overflow:hidden;border-radius:8px;}
  .mundo-tile-nome{font-size:.82rem;color:var(--parch);word-break:break-word;line-height:1.3;}
  .mundo-tile-del{position:absolute;top:4px;right:4px;width:22px;height:22px;z-index:2;}

  .morte-rolando-bg{position:fixed;inset:0;z-index:99;background:rgba(5,3,10,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
  .morte-rolando-icon{color:var(--blood);animation:morteSpin 1.1s linear infinite;}
  @keyframes morteSpin{0%{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(1.18);}100%{transform:rotate(360deg) scale(1);}}
  .morte-rolando-texto{font-family:var(--display);color:var(--blood);font-size:1.4rem;letter-spacing:.03em;text-shadow:0 0 30px rgba(232,128,122,.6);text-align:center;padding:0 20px;}

  .mapa-viewer-bg{position:fixed;inset:0;z-index:98;background:var(--ink);display:flex;flex-direction:column;}
  .mapa-viewer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex:none;}
  .mapa-frame{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none;cursor:grab;}
  .mapa-frame:active{cursor:grabbing;}
  .mapa-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none;}

  .d12-btn{flex:none;border:1px solid var(--line2);background:var(--ink3);color:var(--hope);border-radius:50%;width:32px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .d12-btn:hover{border-color:var(--hope);background:rgba(232,181,79,.14);}
  .d12-btn:active{transform:scale(.92);}

  .lapis-btn{flex:none;border:1px solid var(--line2);background:var(--ink3);color:var(--muted);border-radius:7px;width:26px;height:26px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-right:8px;vertical-align:middle;}
  .lapis-btn:hover{border-color:var(--hope);color:var(--hope);}
  .lapis-btn.on{border-color:var(--seal);color:var(--seal);background:rgba(79,160,128,.14);}
  .icon-btn-roll{flex:none;border:1px solid var(--line2);background:var(--ink3);color:var(--hope);border-radius:7px;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-btn-roll:hover{border-color:var(--hope);background:rgba(232,181,79,.14);}
  .stat-display{font-size:17px;color:var(--parch);padding:7px 0;font-weight:600;}
  .stat-display.lg{font-size:22px;}
  .stat-label-ro{font-size:16px;color:var(--parch);padding:7px 0;min-height:1.2em;}

  /* Aviso compacto no canto, não bloqueia a tela */
  .spotlight-corner{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:85;width:220px;max-width:calc(100vw - 28px);cursor:pointer;animation:spotInCorner .28s cubic-bezier(.2,.8,.3,1);}
  @keyframes spotInCorner{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
  .spotlight-corner-card{position:relative;display:flex;gap:10px;align-items:stretch;background:linear-gradient(160deg,var(--ink3),var(--ink2));
    border:1px solid var(--hope);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;padding:8px;}
  .spotlight-corner-img{flex:none;width:44px;border-radius:6px;overflow:hidden;background:var(--field);}
  .spotlight-corner-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .spotlight-corner-body{min-width:0;flex:1;}
  .spotlight-corner-by{font-family:var(--sc);color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spotlight-corner-title{font-family:var(--display);font-weight:500;color:var(--hope);font-size:1rem;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spotlight-corner-hint{color:var(--parch2);font-size:.7rem;opacity:.75;}
  .spotlight-corner-close{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:var(--parch);cursor:pointer;font-size:10px;line-height:1;padding:0;}

  /* Carta inteira expandida (clicou no aviso do canto) */
  .spotlight-card{cursor:default;position:relative;width:min(380px,100%);background:linear-gradient(160deg,var(--ink3),var(--ink2));
    border:1px solid var(--hope);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(232,181,79,.15) inset;
    overflow:hidden;animation:spotIn .3s cubic-bezier(.2,.8,.3,1);}
  .spotlight-card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(232,181,79,.35);border-radius:9px;pointer-events:none;}
  @keyframes spotIn{from{transform:translateY(-16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .spotlight-img{width:100%;aspect-ratio:5/7;max-height:220px;overflow:hidden;background:var(--field);}
  .spotlight-img img{width:100%;height:100%;object-fit:cover;}
  .spotlight-body{padding:16px 18px 18px;}
  .spotlight-by{font-family:var(--sc);color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .spotlight-title{font-family:var(--display);font-weight:500;color:var(--hope);font-size:1.5rem;margin:0 0 2px;letter-spacing:.01em;}
  .spotlight-sub{color:var(--muted);font-size:.85rem;margin-bottom:10px;}
  .spotlight-text{color:var(--parch);font-size:.92rem;line-height:1.5;margin:0;max-height:160px;overflow-y:auto;}
  .spotlight-close{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:var(--parch);cursor:pointer;font-size:14px;line-height:1;}
  .modal{width:100%;max-width:460px;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:24px;max-height:92vh;overflow-y:auto;}
  .modal-lg{max-width:680px;}

  .errbox{margin-top:12px;font-size:.95rem;padding:10px 14px;border-radius:8px;background:#3a1420;color:#FFC2BB;border:1px solid var(--blood);}

  .campcard{background:var(--ink2);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .campcard .body{padding:16px;}
  .campcard h3{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:0 0 6px;color:var(--parch);}
  .campcard p{font-size:.9rem;color:var(--muted);margin:0 0 14px;}

  .attrbox{background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:14px;text-align:center;}
  .attrbox .n{font-family:var(--serif);font-size:1rem;color:var(--parch);}
  .attrbox input{width:100%;text-align:center;background:transparent;border:none;outline:none;color:var(--hope);
                 font-family:var(--serif);font-size:2rem;margin:8px 0;}
  .attrbox .v{font-size:.78rem;color:var(--muted);margin-bottom:10px;line-height:1.4;}

  .empty{border:1px solid var(--line);border-radius:14px;background:var(--ink2);padding:44px 24px;text-align:center;}
  .empty p.big{font-family:var(--display);font-size:1.6rem;margin:0 0 10px;color:var(--parch);}
  .empty p.small{font-size:1rem;color:var(--muted);margin:0 0 20px;}

  .listitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;
            border-radius:11px;border:1px solid var(--line);background:var(--field);margin-bottom:10px;}
  .listitem .info{font-size:1rem;}
  .listitem .info small{display:block;color:var(--muted);font-size:.85rem;margin-top:3px;}

  header.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:30;}
  header.top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0;flex-wrap:wrap;}
  h1.brand{font-family:var(--display);font-size:1.7rem;font-weight:500;margin:0;color:var(--parch);letter-spacing:.02em;}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  .stack > * + *{margin-top:14px;}
  ::selection{background:rgba(232,181,79,.4);}
  input[type=range]{accent-color:var(--hope);width:100%;}

  /* Editor de imagem por arrastar/rolar */
  .crop-frame{position:relative;overflow:hidden;border-radius:14px;border:2px solid var(--line2);background:var(--field);
              touch-action:none;cursor:grab;margin:0 auto;}
  .crop-frame:active{cursor:grabbing;}
  .crop-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
                   transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .crop-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.9rem;text-align:center;padding:20px;}
  .crop-hint{font-size:.85rem;color:var(--muted);text-align:center;margin-top:10px;}
  .crop-guide-mesa{position:absolute;left:0;right:0;top:50%;aspect-ratio:1/1;transform:translateY(-50%);
    border:2px dashed var(--hope);border-radius:4px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;}
  .crop-guide-mesa span{background:rgba(20,14,36,.8);color:var(--hope);font-size:.68rem;padding:3px 7px;border-radius:5px 5px 0 0;
    font-family:var(--sc);text-transform:uppercase;letter-spacing:.03em;}
  .icon-btn-danger{border:1px solid var(--line2);background:var(--ink3);color:var(--blood);border-radius:8px;width:32px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-btn-danger:hover{border-color:var(--blood);background:rgba(232,128,122,.14);}

  /* Cartas retangulares */
  .cardtile{border-radius:13px;overflow:hidden;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;}
  .cardtile-img{position:relative;aspect-ratio:5/7;overflow:hidden;background:var(--ink3);touch-action:none;}
  .cardtile-img .edit-btn{position:absolute;bottom:6px;right:6px;background:rgba(20,14,36,.75);border:1px solid var(--hope);
                    color:var(--hope);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.9rem;pointer-events:none;}
  .cardtile-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px;}
  .cardtile-body strong{font-family:var(--serif);font-size:1.02rem;color:var(--parch);}
  .cardtile-body .sub{font-size:.78rem;color:var(--muted);}
  .cardtile-body p{font-size:.85rem;color:var(--parch2);margin:4px 0 0;line-height:1.4;}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
  @media (max-width:480px){ .cardgrid{grid-template-columns:repeat(2,1fr);gap:10px;} }

  /* Zonas de contraste na ficha: cada tipo de painel ganha uma cor de identificação */
  .panel[data-accent="combat"]{border-left:4px solid var(--blood);}
  .panel[data-accent="combat"] .panel-head{background:rgba(232,128,122,.07);}
  .panel[data-accent="resource"]{border-left:4px solid var(--hope);}
  .panel[data-accent="resource"] .panel-head{background:rgba(232,181,79,.07);}
  .panel[data-accent="magic"]{border-left:4px solid var(--fear);}

/* ---------- "Mostrar carta pra mesa" — broadcast ao vivo via Firestore ---------- */
function ligarEspiaCartas(cod){
  desligarEspiaCartas();
  if(!dbFB) return;
  espiaCartasVistoPrimeiro = false;
  espiaCartasUnsub = dbFB.collection('appData').doc(K.spotlight(cod)).onSnapshot(snap=>{
    if(!snap.exists) { espiaCartasVistoPrimeiro = true; return; }
    const rec = snap.data().value;
    if(!rec) return;
    if(!espiaCartasVistoPrimeiro){ espiaCartasVistoPrimeiro = true; espiaCartasUltimoTs = rec.ts; return; }
    if(rec.ts === espiaCartasUltimoTs) return;
    espiaCartasUltimoTs = rec.ts;
    state.spotlight = rec;
    render();
    clearTimeout(spotlightTimer);
    spotlightTimer = setTimeout(()=>{ state.spotlight = null; render(); }, 9000);
  }, ()=>{});
}
function desligarEspiaCartas(){
  if(espiaCartasUnsub){ try{ espiaCartasUnsub(); }catch(e){} espiaCartasUnsub = null; }
  clearTimeout(spotlightTimer);
  state.spotlight = null;
}
function firebaseConfigurado(){
  return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
}
function iniciarFirebase(){
  if(firebaseApp) return;
  firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
  authFB = firebase.auth();
  dbFB = firebase.firestore();
}

function limparParaFirestore(valor){
  // remove undefined/funções etc., garantindo um objeto 100% serializável
  return valor === undefined ? null : JSON.parse(JSON.stringify(valor));
}

const DB = {
  async get(key){
    if(!dbFB) return null;
    const snap = await dbFB.collection('appData').doc(key).get();
    return snap.exists ? snap.data().value : null;
  },
  async set(key, value){
    if(!dbFB) return false;
    await dbFB.collection('appData').doc(key).set({ value: limparParaFirestore(value) });
    return true;
  },
  async del(key){
    if(!dbFB) return;
    await dbFB.collection('appData').doc(key).delete();
  },
  async list(prefix){
    if(!dbFB) return [];
    const snap = await dbFB.collection('appData')
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
      .get();
    return snap.docs.map(d => d.id);
  }
};
