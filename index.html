  state.movimentoMorte = { fichaId: mm.fichaId, fase:'rolando', rolandoTexto:'Rolando os Dados de Dualidade…' };
  render();
  setTimeout(()=> App._morteArriscarResolver(mm.fichaId), 1100);
};
App._morteArriscarResolver = async (fichaId)=>{
  const f = getFicha(fichaId);
  const esperanca = d(12), medo = d(12);
  let texto = `Esperança: ${esperanca} · Medo: ${medo}. `;
  if(esperanca===medo){
    f.pv = 0; f.pf = 0; f.status = 'vivo';
    await salvarUmaFicha(f, true);
    texto += 'Sucesso crítico! O personagem continua de pé, recupera todos os Pontos de Vida e zera a Fadiga.';
    state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: esperanca, corDado:'var(--seal)' };
  } else if(esperanca>medo){
    texto += `A Esperança venceu — o personagem continua de pé. Distribua ${esperanca} pontos entre Pontos de Vida e de Fadiga recuperados.`;
    state.movimentoMorte = { fichaId, fase:'distribuir', valor: esperanca, splitPV: esperanca, splitPF: 0, texto, dadoGrande: esperanca, corDado:'var(--hope)' };
  } else if(f.transformacao && f.transformacao.id==='reanimado' && f.pvMax>1){
    texto += 'O Medo venceu — mas você é Reanimado e "Não Fica Morto".';
    state.movimentoMorte = { fichaId, fase:'reanimado', valor: esperanca, texto, dadoGrande: medo, corDado:'var(--fear)' };
  } else {
    f.status = 'morto';
    await salvarUmaFicha(f, true);
    texto += 'O Medo venceu. O personagem atravessa o véu da morte.';
    state.movimentoMorte = { fichaId, fase:'resultado', texto, dadoGrande: medo, corDado:'var(--fear)' };
  }

function cropApplyTransform(){
  const img = document.getElementById('cropImg');
  if(img && state.cropEditor) img.style.transform = `scale(${state.cropEditor.scale}) translate(${state.cropEditor.ox*100}%, ${state.cropEditor.oy*100}%)`;
}
function attachCropListeners(){
  if(!state.cropEditor || !state.cropEditor.img) return;
  const frame = document.getElementById('cropFrame');
  if(!frame) return;
  const pointers = new Map();
  const drag = { active:false, startX:0, startY:0, startOx:0, startOy:0, pinchDist:null, pinchScale:1 };
  frame.onwheel = (e)=>{
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.93;
    state.cropEditor.scale = Math.min(6, Math.max(0.4, state.cropEditor.scale*factor));
    cropApplyTransform();
  };
  frame.onpointerdown = (e)=>{
    frame.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){
      drag.active = true;
      drag.startX = e.clientX; drag.startY = e.clientY;
      drag.startOx = state.cropEditor.ox; drag.startOy = state.cropEditor.oy;
    } else if(pointers.size===2){
      drag.active = false;
      const pts = [...pointers.values()];
      drag.pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      drag.pinchScale = state.cropEditor.scale;
    }
  };
  frame.onpointermove = (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(drag.pinchDist){
        state.cropEditor.scale = Math.min(6, Math.max(0.4, drag.pinchScale*(dist/drag.pinchDist)));
        cropApplyTransform();
      }
    } else if(drag.active && pointers.size===1){
      const rect = frame.getBoundingClientRect();
      const dxFrac = (e.clientX - drag.startX)/rect.width;
      const dyFrac = (e.clientY - drag.startY)/rect.height;
      state.cropEditor.ox = drag.startOx + dxFrac;
      state.cropEditor.oy = drag.startOy + dyFrac;
      cropApplyTransform();
    }
  };
  const endPointer = (e)=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2) drag.pinchDist=null;
    if(pointers.size===0) drag.active=false;
  };
  frame.onpointerup = endPointer;
  frame.onpointercancel = endPointer;
  frame.onpointerleave = (e)=>{ if(pointers.size<=1) endPointer(e); };
}
function mapaApplyTransform(){
  const img = document.getElementById('mapaImg');
  if(img && state.mapaViewer) img.style.transform = `scale(${state.mapaViewer.scale}) translate(${state.mapaViewer.ox*100}%, ${state.mapaViewer.oy*100}%)`;

function garantirCamposFicha(f){
  if(f.tipo==='npc'){
    if(typeof f.habilidades === 'string'){
      f.habilidades = f.habilidades.trim() ? [{id:uid(), nome:'Habilidade', tipo:'passiva', custo:'', texto:f.habilidades}] : [];
    }
    if(!f.habilidades) f.habilidades = [];
    if(f.experiencia===undefined) f.experiencia = '';
    if(f.retrato===undefined) f.retrato = null;
    return f;
  }
  if(f.tipo==='ambiente'){
    if(!f.habilidades) f.habilidades = [];
    if(f.ambienteTipo===undefined) f.ambienteTipo = 'Exploração';
    if(f.adversariosSugeridos===undefined) f.adversariosSugeridos = '';
    return f;
  }
  if(f.tipo!=='pc') return f;
  if(!f.avancos) f.avancos = { 2:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,proficiencia:0}, 3:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0}, 4:{atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0} };
  if(!f.avancos[2]) f.avancos[2] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,proficiencia:0};
  if(!f.avancos[3]) f.avancos[3] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0};
  if(!f.avancos[4]) f.avancos[4] = {atributos:0,pv:0,pf:0,exp:0,dominio:0,evasao:0,subclasse:0,proficiencia:0,multiclasse:0};
  if(!f.atributosTravados) f.atributosTravados = [];
  if(f.subclasseTier===undefined || f.subclasseTier===null) f.subclasseTier = 0;
  if(f.multiclasse===undefined) f.multiclasse = null;
  if(f.multiclasseNotas===undefined) f.multiclasseNotas = '';
  if(f.cardImages===undefined) f.cardImages = {};
  if(f.retrato===undefined) f.retrato = null;
  if(f.ancestralidadeMista===undefined) f.ancestralidadeMista = null;
  garantirRecursos(f);
  if(f.cicatrizes===undefined) f.cicatrizes = 0;
  if(f.status===undefined) f.status = 'vivo';
  if(!f.armaduras){
    f.armaduras = (f.armaduraAtiva && f.armaduraAtiva.nome) ? [{id:uid(), ...f.armaduraAtiva}] : [];
    f.armaduraAtivaId = f.armaduras[0]? f.armaduras[0].id : null;
  }
  if(f.armaduraAtivaId===undefined) f.armaduraAtivaId = null;
  if(f.limiarMaiorBase===undefined || f.limiarGraveBase===undefined){
    const c = CLASSES[f.classe];
    let lim = [5,11];
    if(c && c.armadura && c.armadura.limiares) lim = c.armadura.limiares.split('/').map(s=>parseInt(s));
    else if(f.armaduraAtiva && f.armaduraAtiva.limiares) lim = f.armaduraAtiva.limiares.split('/').map(s=>parseInt(s));
    if(f.limiarMaiorBase===undefined) f.limiarMaiorBase = (f.limiarMaior!==undefined? f.limiarMaior : lim[0]) || lim[0];
    if(f.limiarGraveBase===undefined) f.limiarGraveBase = (f.limiarGrave!==undefined? f.limiarGrave : lim[1]) || lim[1];
  }
  if(f.limiarBonusMaior===undefined) f.limiarBonusMaior = 0;

    rotulo:`Dano · ${arma.nome||'arma'} (${n}d${lados}${extra?sgn(extra):''})`, dados, mod:extra,

};

  const rolls = Array.from({length:dados}, ()=>d(12));
  const tabela = tipo==='item'? TESOURO_TABELA : CONSUMIVEIS_TABELA;
  const soma = Math.min(rolls.reduce((a,b)=>a+b,0), tabela[tabela.length-1][0]);
  const achado = tabela.find(t=>t[0]===soma) || tabela[tabela.length-1];
  state.ultimoTesouro = { nome: achado[1], descricao: achado[2] };
  registrarRolagem({id:uid(), ts:Date.now(), tipo:'simples', autor: state.usuario.nome,

};

App.recompConceder = async ()=>{
  const xp = Number(document.getElementById('recompXp').value)||0;
  const ouro = Number(document.getElementById('recompOuro').value)||0;
  const nota = document.getElementById('recompNota').value;
  if(state.recompSel.length===0) return;
  state.fichas = state.fichas.map(f=> state.recompSel.includes(f.id)
    ? {...f, xp:(f.xp||0)+xp, ouro:{...f.ouro, punhados:(f.ouro?.punhados||0)+ouro}} : f);
  await DB.set(K.sheets(state.campanha.codigo), state.fichas);
  const h = {id:uid(), ts:Date.now(), alvos:[...state.recompSel],
    nomes: state.fichas.filter(f=>state.recompSel.includes(f.id)).map(f=>f.nome||'Sem nome'),
    xp, ouro, nota, revertido:false};
  state.historico = [h, ...state.historico];
  await DB.set(K.rewards(state.campanha.codigo), state.historico);
  state.recompSel = [];
  render();
};
App.recompReverter = async (hid)=>{
  const h = state.historico.find(x=>x.id===hid); if(!h) return;
  state.fichas = state.fichas.map(f=> h.alvos.includes(f.id)
    ? {...f, xp:Math.max(0,(f.xp||0)-h.xp), ouro:{...f.ouro, punhados:Math.max(0,(f.ouro?.punhados||0)-h.ouro)}} : f);
  await DB.set(K.sheets(state.campanha.codigo), state.fichas);
  state.historico = state.historico.map(x=> x.id===hid? {...x, revertido:true} : x);
  await DB.set(K.rewards(state.campanha.codigo), state.historico);
  render();
};
App.resetarXP = async (id)=>{
  state.fichas = state.fichas.map(f=> f.id===id? {...f, xp:0} : f);
  await DB.set(K.sheets(state.campanha.codigo), state.fichas);

};
App.limparFicha = async (id, nome)=>{

  state.fichas = state.fichas.map(f=> f.id===id? {...novaFicha(f.dono), id:f.id} : f);
  await DB.set(K.sheets(state.campanha.codigo), state.fichas);
  render();
};

function ViewTable(){

  if(ehMestre){ abas.push(['npcs','NPCs','caveira']); abas.push(['ambientes','Ambientes','mapa']); abas.push(['tesouro','Tesouro','bau']); abas.push(['recompensas','Recompensas','presente']); }
  abas.push(['dados','Rolagem','dado']);

      <div class="row" style="min-width:0;">

          ${icon('caveira',16)} <strong style="color:var(--fear);font-size:1rem;">${camp.medo||0}</strong><span class="muted" style="font-size:.78rem;">/12</span>

        <span class="muted" style="font-size:12px;">${ehMestre?'Mestre':'Jogador'} · ${esc(u.nome)}</span>
      </span>

      ${abas.map(([k,n,ic])=>`<button class="tab ${state.tableTab===k?'active':''}" onclick="App.setTableTab('${k}')">${icon(ic,16)} ${n}</button>`).join('')}

  <main class="wrap" style="padding-top:26px;padding-bottom:110px;">
    ${TableBody(ehMestre)}
  </main>

  ${state.mostrandoLoja? LojaModal():''}
  ${state.mostrandoPicker? CardPickerModal():''}
  ${state.mistaEditor? MixedAncestryModal():''}
  ${state.levelUp? LevelUpModal():''}
  ${state.movimentoMorte? MovimentoMorteModal():''}
  ${state.mostrandoBestiario? BestiarioModal():''}
  ${state.spotlight? SpotlightHTML():''}

  ${state.mapaViewer? MapaViewerModal():''}
  ${state.transformando? TransformacaoModal():''}
  ${state.spotlightExpandido? SpotlightExpandidoHTML():''}
  `;
}

function TableBody(ehMestre){
  const t = state.tableTab;
  if(t==='mestre') return TabMestre();
  if(t==='personagens') return TabPersonagens(ehMestre);
  if(t==='npcs') return TabNPCs();
  if(t==='ambientes') return TabAmbientes();
  if(t==='mundo') return TabMundo();
  if(t==='tesouro') return TabTesouro();
  if(t==='recompensas') return TabRecompensas();
  if(t==='dados') return TabDados();
  if(t==='guia') return TabGuiaJogo();
  if(t==='guiamestre') return TabGuiaMestre();
  return '';
}

            <span style="font-size:1rem;color:var(--parch);"><strong>${esc(nome)}</strong> <span class="muted" style="font-size:.85rem;">· limiares ${esc(limiares)} · armadura base ${base}</span></span>

function pipsHTML(id, campo, n, max, cor, npc){
  const setter = npc? 'App.npcPip':'App.fPip';
  let html='';
  for(let i=0;i<Math.max(0,max);i++){
    const on = i<n;
    html += `<button class="pip ${on?'on':''}" style="background:${on?cor:'transparent'};border-color:${on?cor:'#4A4362'};"
              onclick="${setter}('${id}','${campo}', ${i}<${n}?${i}:${i+1})"></button>`;
  }
  return `<div class="pips">${html}</div>`;
}

function EstanciasHTML(f, st){
  const r = f.recursos; const tier = tierDoNivel(f.nivel||1); const edit = painelEditando('estancias', f.id);
  let html = `<hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">
    <div class="between" style="margin-bottom:8px;"><strong>Foco & Posturas Marciais</strong>${lapisEditBtn('estancias',f.id)}</div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
      <span>Foco:</span><button class="btn btn-sm btn-ghost" onclick="App.fRecNum('${f.id}','focus',-1,0,6)">−</button>
      <strong style="font-size:1.3rem;color:var(--hope);">${r.focus}/6</strong>
      <button class="btn btn-sm btn-ghost" onclick="App.fRecNum('${f.id}','focus',1,0,6)">+</button>
      <button class="btn btn-sm btn-gold" onclick="App.fRefocar('${f.id}')">Refocar (${Math.max(1,f.atributos.instinto||0)}d6)</button></div>
    ${r.estanciaAtiva? `<p style="margin:0 0 10px;color:var(--hope);">Postura ativa: <strong>${esc(r.estanciaAtiva)}</strong> <button class="btn btn-sm btn-ghost" onclick="App.fSairEstancia('${f.id}')">Sair da postura</button></p>` : '<p class="muted" style="font-size:13px;margin:0 0 10px;">Nenhuma postura ativa. Assumir uma custa 1 Foco.</p>'}`;
  for(let t=1;t<=4;t++){
    if(t>tier) break;
    html += `<p class="muted" style="margin:10px 0 4px;font-size:12px;">${t}º patamar</p>`;
    html += ESTANCIAS[t].map(([n,tx])=>{
      const conhecida = r.estanciasConhecidas.includes(n);
      if(!edit && !conhecida) return '';
      const ativa = r.estanciaAtiva===n;
      return `<div class="listitem" style="${ativa?'border-color:var(--hope);background:rgba(232,181,79,.08);':''}">
        <div class="info" style="flex:1;"><strong>${esc(n)}</strong><div class="muted" style="font-size:12px;">${esc(tx)}</div></div>
        ${edit? `<label class="row" style="gap:6px;font-size:12px;"><input type="checkbox" ${conhecida?'checked':''} onchange="App.fEstanciaConhecer('${f.id}','${esc(n)}')"> conhecida</label>`
              : (ativa? '' : `<button class="btn btn-sm btn-gold" onclick="App.fAssumirEstancia('${f.id}','${esc(n)}')">Assumir</button>`)}
      </div>`;}).join('');
  }
  if(!edit && r.estanciasConhecidas.length===0) html += '<p class="muted" style="font-size:13px;">Nenhuma postura conhecida. Clique no lápis para escolher duas do 1º patamar.</p>';
  html += `<p class="muted" style="font-size:12px;margin-top:8px;">Conhecidas: ${r.estanciasConhecidas.length} (comece com 2 do 1º patamar e adicione 1 a cada nível)${st>=2? ' · Estado de Fluxo: pode pagar 1 Fadiga em vez de 1 Foco para mudar de postura.':''}</p>`;
  return html;
}

/* ---- ações ---- */
App.fRec = (id,campo,val)=>{ const f=getFicha(id); garantirRecursos(f); f.recursos[campo]=val; agendarSalvar(f); };
App.fRecNum = (id,campo,delta,min,max)=>{ const f=getFicha(id); const r=garantirRecursos(f); r[campo]=Math.max(min,Math.min(max,(r[campo]||0)+delta)); salvarUmaFicha(f); };
App.fRecZerar = (id,campo)=>{ const f=getFicha(id); garantirRecursos(f).tokens=0; salvarUmaFicha(f); };
App.fAssassinoMarcar = (id,on)=>{ const f=getFicha(id); const r=garantirRecursos(f); if(on){ marcarFadigaFicha(f,1); } r.alvoAtivo=on; salvarUmaFicha(f); };
App.fAssassinoDano = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const tier=tierDoNivel(f.nivel||1); const st=f.subclasseTier||0;
  const lado = f.subclasseId==='Guilda dos Executores'? (st>=2?8:6) : 4; const dados=Array.from({length:tier},()=>d(lado));
  logRolagem(f, `Marcado para Morrer · ${tier}d${lado}${r.alvo? ' em '+r.alvo:''}`, dados, dados.reduce((a,b)=>a+b,0)); };
App.fVenenoPreparar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); marcarFadigaFicha(f,1); const n=d(4)+1; r.tokens=(r.tokens||0)+n; salvarUmaFicha(f); };
App.fComboPasso = (id,dir)=>{ const f=getFicha(id); const r=garantirRecursos(f); let i=COMBO_PASSOS.indexOf(r.comboDado); i=Math.max(0,Math.min(COMBO_PASSOS.length-1,i+dir)); r.comboDado=COMBO_PASSOS[i]; salvarUmaFicha(f); };
App.fGolpeCombo = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const lados=parseInt(r.comboDado.slice(1));
  marcarFadigaFicha(f,1); const rolls=[d(lados)]; let guard=0;
  while(guard++<60){ const n=d(lados); rolls.push(n); if(n<rolls[rolls.length-2]) break; }
  salvarUmaFicha(f,true); logRolagem(f, `Golpe Combo (${r.comboDado})`, rolls, rolls.reduce((a,b)=>a+b,0)); };
App.fRefocar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const n=Math.max(1,f.atributos.instinto||0);
  const rolls=Array.from({length:n},()=>d(6)); r.focus=Math.min(6,Math.max(...rolls)); salvarUmaFicha(f,true);
  logRolagem(f, `Refocar (${n}d6 — maior = Foco)`, rolls, r.focus); };
App.fEstanciaConhecer = (id,nome)=>{ const f=getFicha(id); const r=garantirRecursos(f); const i=r.estanciasConhecidas.indexOf(nome); if(i>=0) r.estanciasConhecidas.splice(i,1); else r.estanciasConhecidas.push(nome); salvarUmaFicha(f); };
App.fAssumirEstancia = (id,nome)=>{ const f=getFicha(id); const r=garantirRecursos(f); const st=f.subclasseTier||0;
  if(r.focus>0) r.focus-=1; else if(st>=2){ marcarFadigaFicha(f,1); } else { alert('Você precisa de 1 Foco para assumir uma postura.'); return; }
  r.estanciaAtiva=nome; salvarUmaFicha(f); };
App.fSairEstancia = (id)=>{ const f=getFicha(id); garantirRecursos(f).estanciaAtiva=''; salvarUmaFicha(f); };
App.fRolarPatrono = (id,gastar)=>{ const f=getFicha(id); const r=garantirRecursos(f); const el=document.getElementById('patronoN');
  const n=Math.max(1,Math.min(20,parseInt(el&&el.value)||1)); if(gastar){ if((r.favor||0)<n){ alert('Favores insuficientes.'); return; } r.favor-=n; }
  const lado=(f.nivel||1)>=5?8:6; const dados=Array.from({length:n},()=>d(lado)); salvarUmaFicha(f,true);
  logRolagem(f, `Dado${n>1?'s':''} de Patrono (${n}d${lado})${r.patronoNome? ' · '+r.patronoNome:''}`, dados, dados.reduce((a,b)=>a+b,0)); };
App.fBruxoTributo = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); r.favor=(r.favor||0)+Math.max(0,atributoConjuracao(f).valor); salvarUmaFicha(f); };
App.fHexAdicionar = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const max=Math.max(1,atributoConjuracao(f).valor);
  if(r.hexes.length>=max){ alert('Você já está no máximo de criaturas sob Malefício ('+max+'). Remova uma antes.'); return; }
  const el=document.getElementById('hexNome'); const nome=(el&&el.value.trim())||('Alvo '+(r.hexes.length+1));
  marcarFadigaFicha(f,1); r.hexes.push(nome); salvarUmaFicha(f); };
App.fHexRemover = (id,i)=>{ const f=getFicha(id); garantirRecursos(f).hexes.splice(i,1); salvarUmaFicha(f); };
App.fComunhao = (id)=>{ const f=getFicha(id); const r=garantirRecursos(f); const n=Math.max(1,atributoConjuracao(f).valor);
  const dados=Array.from({length:n},()=>d(6)); r.ultimoCommune={dados}; salvarUmaFicha(f,true);
  logRolagem(f, `Comunhão (${n}d6 — escolha um)`, dados, Math.max(...dados)); };
App.fFaseLua = (id,inc)=>{ const f=getFicha(id); const r=garantirRecursos(f);
  if(!inc){ r.fase=d(6); } else { if(!r.fase){ alert('Role a fase da sessão primeiro.'); return; } if((f.esperanca||0)<1){ alert('Você precisa de 1 Esperança.'); return; } f.esperanca-=1; r.fase = r.fase>=6? 1 : r.fase+1; }
  salvarUmaFicha(f); };

function anunciarNaMesa(rec){
  const full = Object.assign({ts:Date.now(), autor:state.usuario.nome, img:null, imgTransform:'', subtitulo:''}, rec);
  espiaCartasUltimoTs = full.ts; state.spotlight = full; render();
  clearTimeout(spotlightTimer); spotlightTimer = setTimeout(()=>{ state.spotlight=null; render(); }, 9000);
  try{ const pr = DB.set(K.spotlight(state.campanha.codigo), full); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
}

App.morteReanimado = async (sobreviver)=>{
  const mm=state.movimentoMorte; const f=getFicha(mm.fichaId);
  if(sobreviver){
    f.pvMax=Math.max(1,f.pvMax-1); f.pv=Math.min(f.pv,f.pvMax);
    state.movimentoMorte={fichaId:mm.fichaId, fase:'distribuir', valor:mm.valor, splitPV:mm.valor, splitPF:0, dadoGrande:mm.valor, corDado:'var(--hope)',
      texto:`Não Fica Morto! Você marcou 1 Ponto de Vida permanentemente (máximo agora ${f.pvMax}) e sobrevive. Distribua ${mm.valor} pontos (valor do Dado de Esperança) entre Pontos de Vida e Fadiga recuperados.`};
    await salvarUmaFicha(f,true);
  } else {
    f.status='morto'; await salvarUmaFicha(f,true);
    state.movimentoMorte={fichaId:mm.fichaId, fase:'resultado', texto:mm.texto+' O personagem atravessa o véu da morte.', dadoGrande:mm.dadoGrande, corDado:'var(--fear)'};
  }
  render();
};

function categoriasCartas(f){
  const ancHabs = getAncestralidadeHabs(f);
  const com = COMUNIDADES_INFO[f.comunidade];
  const todasCartas = [...(f.mao||[]).map(k=>({key:k,local:'Mão'})), ...(f.reserva||[]).map(k=>({key:k,local:'Reserva'}))]
    .map(x=>({...x, carta: findCard(x.key)})).filter(x=>x.carta);
  const feiticos = todasCartas.filter(x=> x.carta.tipo.includes('Feitiço') || x.carta.tipo.includes('Grimório'));
  const talentos = todasCartas.filter(x=> x.carta.tipo==='Talento');
  const cats = [];
  if(ancHabs) cats.push({id:'ancestralidade', nome:'Ancestralidade', itens: ancHabs.map(([n,t])=>(
    {key:`Ancestralidade|${n}`, titulo:n, subtitulo:f.ancestralidade, texto:t}))});
  if(com) cats.push({id:'comunidade', nome:'Comunidade', itens: [
    {key:`Comunidade|${com.habilidade[0]}`, titulo:com.habilidade[0], subtitulo:f.comunidade, texto:com.habilidade[1]}]});
  cats.push({id:'feiticos', nome:`Feitiços & Grimórios (${feiticos.length})`, itens: feiticos.map(x=>(
    {key:x.key, titulo:x.carta.nome, subtitulo:`${x.carta.dominio} · nv.${x.carta.nivel} · ${x.local}`, texto:x.carta.texto, removivel:true, local:x.local}))});
  cats.push({id:'talentos', nome:`Talentos (${talentos.length})`, itens: talentos.map(x=>(
    {key:x.key, titulo:x.carta.nome, subtitulo:`${x.carta.dominio} · nv.${x.carta.nivel} · ${x.local}`, texto:x.carta.texto, removivel:true, local:x.local}))});
  return cats;
}

      <button class="btn btn-gold" onclick="App.abrirMovimentoMorte('${f.id}')">Fazer Movimento de Morte</button>
    </div></div>` : ''}

  <div class="panel"><div class="panel-body">
    <div style="display:flex;gap:20px;flex-wrap:wrap;">
      ${RetratoThumbHTML(f)}
      <div style="flex:1;min-width:260px;">
        <div class="grid g3">
          <div class="field"><label>Nome</label><input value="${esc(f.nome)}" oninput="App.fCampo('${f.id}','nome',this.value)"></div>
          <div class="field"><label>Gênero</label><input value="${esc(f.genero)}" oninput="App.fCampo('${f.id}','genero',this.value)"></div>
          <div class="field"><label>Classe</label>
            <select onchange="App.fSelect('${f.id}','classe',this.value)">
              <option value="">—</option>

            </select>
          </div>
          <div class="field"><label>Ancestralidade</label>
            ${f.ancestralidadeMista ? `
              <div class="row" style="gap:6px;">
                <input value="${esc(f.ancestralidade)}" style="flex:1;" disabled>
                <button class="btn btn-sm btn-ghost" type="button" onclick="App.abrirAncestralidadeMista('${f.id}')">Editar</button>
              </div>
              <p class="muted" style="font-size:.78rem;margin:4px 0 0;">Mista: ${esc(f.ancestralidadeMista.origens.join(' + '))}</p>
            ` : `
              <select onchange="App.fSetAncestralidade('${f.id}',this.value)">
                <option value="">—</option>
                ${ANCESTRALIDADES.map(a=>`<option value="${a}" ${f.ancestralidade===a?'selected':''}>${a}</option>`).join('')}
                <option value="__mista__">✦ Ancestralidade Mista…</option>
              </select>
            `}
          </div>
          <div class="field"><label>Comunidade</label><input list="comL" value="${esc(f.comunidade)}" oninput="App.fCampo('${f.id}','comunidade',this.value)"></div>
          <div class="field"><label>Subclasse</label>
            <select onchange="App.fSetSubclasse('${f.id}',this.value)">
              <option value="">—</option>
              ${f.classe && SUBCLASSES[f.classe] ? Object.keys(SUBCLASSES[f.classe]).map(s=>`<option value="${esc(s)}" ${f.subclasseId===s?'selected':''}>${esc(s)}</option>`).join('') : ''}
            </select>
          </div>
          <div class="field"><label>Nível</label>
            <div class="row" style="gap:8px;">
              <input type="number" value="${f.nivel}" disabled style="max-width:70px;text-align:center;">
              <button class="btn btn-sm btn-gold" onclick="App.abrirSubirNivel('${f.id}')" ${f.nivel>=10?'disabled':''}>${icon('coroa',15)} Subir de Nível</button>
              ${ehMestre? `<button class="btn btn-sm btn-ghost" onclick="App.fMestreAjustarNivel('${f.id}')" title="Ajustar nível diretamente, sem conceder avanços — use para um personagem substituto">Ajustar</button>` : ''}
            </div>
          </div>
          <div class="field"><label>Proficiência</label><input type="number" min="1" value="${f.proficiencia}" oninput="App.fCampoNum('${f.id}','proficiencia',this.value)"></div>
          ${ehMestre? `<div class="field"><label>Jogador responsável</label>
            <select onchange="App.fSelect('${f.id}','dono',this.value)">
              <option value="">Sem dono (do mestre)</option>
              ${jogadores.map(j=>`<option value="${esc(j)}" ${f.dono===j?'selected':''}>${esc(j)}</option>`).join('')}
            </select></div>` : ''}
        </div>
        <datalist id="ancL">${ANCESTRALIDADES.map(a=>`<option value="${a}">`).join('')}</datalist>
        <datalist id="comL">${COMUNIDADES.map(a=>`<option value="${a}">`).join('')}</datalist>
        ${f.classe? `<p class="muted" style="font-size:12px;margin-top:12px;margin-bottom:0;">Domínios: ${CLASSES[f.classe].dominios}</p>`:''}
      </div>
    </div>
  </div></div>

  ${CartasPersonagemPanelHTML(f)}

  <div class="panel">
    <div class="panel-head"><h3>${lapisEditBtn('atributos',f.id)}Atributos</h3>
      <div class="row" style="gap:4px;">
        ${[[1,'Vantagem'],[0,'Normal'],[-1,'Desvantagem']].map(([v,n])=>`
          <button class="btn btn-sm ${state.vantagem===v?'':'btn-ghost'}" onclick="App.setVantagem(${v})">${n}</button>`).join('')}
      </div>
    </div>
    <div class="panel-body">
      <div class="grid g6">
        ${ATRIBUTOS.map(a=>`
          <div class="attrbox">
            <div class="n">${a.n}</div>
            ${painelEditando('atributos',f.id)
              ? `<input type="number" value="${f.atributos[a.k]}" onchange="App.fSubNum('${f.id}','atributos','${a.k}',this.value)">`
              : `<div class="stat-display lg">${f.atributos[a.k]}</div>`}
            <div class="v">${a.v}</div>
            <button class="icon-btn-roll" style="margin:6px auto 0;" title="Rolar ${a.n}" onclick="App.rolarAtributo('${f.id}','${a.k}','${a.n}')">${icon('dado',16)}</button>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="cols2">
    <div>
      <div class="panel" data-accent="combat"><div class="panel-head"><h3>${lapisEditBtn('saude',f.id)}${icon('coracao')} Saúde & Dano</h3></div><div class="panel-body">
        <div class="grid g2" style="margin-bottom:16px;">
          <div class="field"><label>Evasão</label>${painelEditando('saude',f.id)
            ? `<input type="number" value="${f.evasao}" oninput="App.fCampoNum('${f.id}','evasao',this.value)">`
            : `<div class="stat-display lg">${f.evasao}</div>`}</div>
          <div>
            <label class="lbl">Armadura</label>
            <div class="row">
              ${pipsHTML(f.id,'armadura',f.armadura,f.armaduraMax,'var(--seal)')}
              ${painelEditando('saude',f.id)
                ? `<input type="number" value="${f.armaduraMax}" style="width:56px;padding:6px;border-radius:6px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" onchange="App.fMaxCampo('${f.id}','armaduraMax','armadura',this.value)">`
                : `<span class="muted" style="font-size:13px;">/ ${f.armaduraMax}</span>`}
            </div>
          </div>
        </div>
        <div class="grid g3" style="text-align:center;margin-bottom:12px;">
          <div class="attrbox"><div style="font-size:12px;">Dano menor</div><div style="font-family:var(--serif);color:var(--muted);font-size:20px;margin:4px 0;">—</div><div style="font-size:10px;color:var(--muted);">marque 1 PV</div></div>
          <div class="attrbox"><div style="font-size:12px;">Dano maior</div><div style="font-family:var(--serif);color:var(--hope);font-size:26px;margin:6px 0;">${limiaresCalculados(f).maior}</div><div style="font-size:10px;color:var(--muted);">marque 2 PV</div></div>
          <div class="attrbox"><div style="font-size:12px;">Dano grave</div><div style="font-family:var(--serif);color:var(--hope);font-size:26px;margin:6px 0;">${limiaresCalculados(f).grave}</div><div style="font-size:10px;color:var(--muted);">marque 3 PV</div></div>
        </div>
        <p class="muted" style="font-size:11px;margin:0 0 12px;">Calculado automaticamente: base da armadura + nível (${f.nivel}) + bônus. Ajuste a base e o bônus no painel "Armadura Ativa".</p>
        <div style="margin-bottom:12px;">
          <div class="between" style="margin-bottom:6px;"><span class="muted" style="font-size:12px;">Pontos de Vida</span>
            ${painelEditando('saude',f.id)
              ? `<input type="number" value="${f.pvMax}" style="width:56px;padding:6px;border-radius:6px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" onchange="App.fMaxCampo('${f.id}','pvMax','pv',this.value)">`
              : `<span class="muted" style="font-size:12px;">máx. ${f.pvMax}</span>`}</div>
          ${pipsHTML(f.id,'pv',f.pv,f.pvMax,'var(--blood)')}
        </div>
        <div>
          <div class="between" style="margin-bottom:6px;"><span class="muted" style="font-size:12px;">Pontos de Fadiga</span>
            ${painelEditando('saude',f.id)
              ? `<input type="number" value="${f.pfMax}" style="width:56px;padding:6px;border-radius:6px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" onchange="App.fMaxCampo('${f.id}','pfMax','pf',this.value)">`
              : `<span class="muted" style="font-size:12px;">máx. ${f.pfMax}</span>`}</div>
          ${pipsHTML(f.id,'pf',f.pf,f.pfMax,'var(--fear)')}
        </div>
      </div></div>

      <div class="panel" data-accent="resource"><div class="panel-head"><h3>${lapisEditBtn('habEsperanca',f.id)}${icon('estrela')} Esperança</h3>${f.cicatrizes? `<span class="muted" style="font-size:.78rem;">${f.cicatrizes} cicatriz${f.cicatrizes>1?'es':''}</span>`:''}</div><div class="panel-body">
        ${pipsHTML(f.id,'esperanca',f.esperanca,Math.max(0,6-(f.cicatrizes||0)),'var(--hope)')}
        <p class="muted" style="font-size:12px;margin:12px 0 0;">Gaste 1 Ponto de Esperança para usar uma Experiência ou prestar ajuda. Cada cicatriz risca permanentemente uma casa de Esperança.</p>
        <div class="field" style="margin-top:12px;"><label>Habilidade de Esperança</label>${painelEditando('habEsperanca',f.id)
          ? `<textarea rows="3" oninput="App.fCampo('${f.id}','habEsperanca',this.value)">${esc(f.habEsperanca)}</textarea>`
          : `<div class="stat-label-ro" style="white-space:pre-wrap;line-height:1.5;">${esc(f.habEsperanca)||'—'}</div>`}</div>
      </div></div>

      <div class="panel" data-accent="lore"><div class="panel-head"><h3>${icon('pergaminho')} Experiências</h3><button class="btn btn-sm" onclick="App.fExpAdd('${f.id}')">Adicionar</button></div>
        <div class="panel-body">
        ${ f.experiencias.length===0? '<p class="muted" style="margin:0;font-size:13px;">Crie duas Experiências com o mestre e registre aqui.</p>' : f.experiencias.map((e,i)=>`
          <div class="row" style="margin-bottom:8px;">
            <input value="${esc(e.nome)}" placeholder="ex: Contrabandista de Vale-Frio" style="flex:1;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fExpSet('${f.id}',${i},'nome',this.value)">
            <input type="number" value="${e.mod}" style="width:60px;padding:9px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--hope);text-align:center;" onchange="App.fExpSet('${f.id}',${i},'mod',this.value)">
            <button class="btn btn-sm btn-purple" onclick="App.rolarExperiencia('${f.id}',${i})">${icon('dado',15)} Rolar</button>
            <button class="btn btn-sm btn-danger" onclick="App.fExpDel('${f.id}',${i})">×</button>
          </div>`).join('') }
        </div></div>

      <div class="panel" data-accent="resource"><div class="panel-head"><h3>${icon('moeda')} Ouro</h3></div><div class="panel-body">
        <div class="grid g3">
          <div class="field"><label>Punhados</label><input type="number" min="0" value="${f.ouro.punhados}" onchange="App.fSubNum('${f.id}','ouro','punhados',this.value)"></div>
          <div class="field"><label>Bolsas</label><input type="number" min="0" value="${f.ouro.bolsas}" onchange="App.fSubNum('${f.id}','ouro','bolsas',this.value)"></div>
          <div class="field"><label>Baús</label><input type="number" min="0" value="${f.ouro.bau}" onchange="App.fSubNum('${f.id}','ouro','bau',this.value)"></div>
        </div>
        ${f.xp>0? `<p class="muted" style="font-size:12px;margin:12px 0 0;color:var(--hope);">XP acumulado por recompensas: ${f.xp}</p>`:''}
      </div></div>
    </div>

    <div>
      <div class="panel" data-accent="combat"><div class="panel-head"><h3>${lapisEditBtn('armas',f.id)}${icon('espada')} Armas ativas</h3><button class="btn btn-sm btn-gold" onclick="App.abrirLoja('${f.id}')">${icon('mochila',15)} Adquirir Itens</button></div><div class="panel-body">
        ${[['Principal','arma1'],['Secundária','arma2']].map(([lab,k])=>{
          const editando = painelEditando('armas',f.id);
          const campo = (label,sub)=> editando
            ? `<div class="field"><label>${label}</label><input value="${esc(f[k][sub])}" oninput="App.fSub('${f.id}','${k}','${sub}',this.value)"></div>`
            : `<div class="field"><label>${label}</label><div class="stat-label-ro">${esc(f[k][sub])||'—'}</div></div>`;
          return `
          <div style="padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);">
            <div class="between" style="margin-bottom:8px;"><span style="font-family:var(--serif);">${lab}</span>
              <button class="icon-btn-roll" title="Rolar dano" onclick="App.rolarDano('${f.id}','${k}')">${icon('dado',16)}</button></div>
            <div class="grid g3">
              ${campo('Nome','nome')}
              ${campo('Atributo & alcance','atr')}
              ${campo('Dados & tipo de dano','dano')}
            </div>
            <div style="margin-top:8px;">${campo('Habilidade','hab')}</div>
          </div>`;}).join('')}
      </div></div>

      <div class="panel" data-accent="combat"><div class="panel-head"><h3>${lapisEditBtn('armadura',f.id)}${icon('escudo')} Armadura ativa</h3><button class="btn btn-sm btn-gold" onclick="App.abrirLoja('${f.id}','armaduras')">${icon('mochila',15)} Adquirir Itens</button></div><div class="panel-body">
        <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);">
          <p class="muted" style="font-size:12px;margin:0 0 8px;">Armaduras adquiridas — escolha qual usar:</p>
          ${(!f.armaduras || f.armaduras.length===0)
            ? `<p class="muted" style="font-size:13px;margin:0;">Nenhuma armadura disponível.</p>`
            : f.armaduras.map(a=>`
            <div class="listitem" style="${f.armaduraAtivaId===a.id? 'border-color:var(--hope);background:rgba(232,181,79,.08);':''}">
              <div class="info" style="flex:1;">
                <strong style="font-family:var(--serif);font-size:15px;color:var(--parch);">${esc(a.nome)}</strong>
                <div class="muted" style="font-size:12px;">limiares ${esc(a.limiares)} · armadura base ${esc(a.base)}</div>
              </div>
              <div class="row" style="gap:6px;">
                ${f.armaduraAtivaId===a.id
                  ? `<span class="muted" style="font-size:12px;color:var(--hope);">${icon('check',14)} equipada</span>`
                  : `<button class="btn btn-sm btn-gold" onclick="App.fEquiparArmadura('${f.id}','${a.id}')">Equipar</button>`}
                <button class="icon-btn-danger" title="Remover da lista" onclick="App.fRemoverArmadura('${f.id}','${a.id}')">${icon('lixeira',14)}</button>
              </div>
            </div>`).join('')}
        </div>
        ${(()=>{
          const editando = painelEditando('armadura',f.id);
          const campoSub = (label,sub)=> editando
            ? `<div class="field"><label>${label}</label><input value="${esc(f.armaduraAtiva[sub])}" oninput="App.fSub('${f.id}','armaduraAtiva','${sub}',this.value)"></div>`
            : `<div class="field"><label>${label}</label><div class="stat-label-ro">${esc(f.armaduraAtiva[sub])||'—'}</div></div>`;
          const campoNum = (label,campo)=> editando
            ? `<div class="field"><label>${label}</label><input type="number" value="${f[campo]}" onchange="App.fCampoNum('${f.id}','${campo}',this.value)"></div>`
            : `<div class="field"><label>${label}</label><div class="stat-display">${f[campo]}</div></div>`;
          return `
        <div class="grid g3">
          ${campoSub('Nome','nome')}
          ${campoSub('Limiares base (exibição)','limiares')}
          ${campoSub('Armadura base','base')}
        </div>
        <div style="margin-top:8px;">${campoSub('Habilidade','hab')}</div>
        <p class="muted" style="font-size:12px;margin:14px 0 8px;">Estes valores alimentam o cálculo automático dos limiares de dano em "Saúde & Dano".</p>
        <div class="grid g4">
          ${campoNum('Limiar maior (base)','limiarMaiorBase')}
          ${campoNum('Limiar grave (base)','limiarGraveBase')}
          ${campoNum('Bônus limiar maior','limiarBonusMaior')}
          ${campoNum('Bônus limiar grave','limiarBonusGrave')}
        </div>`;
        })()}
      </div></div>

      <div class="panel" data-accent="lore"><div class="panel-head"><h3>${lapisEditBtn('inventario',f.id)}${icon('mochila')} Inventário</h3>
        <div class="row" style="gap:6px;">
          <button class="btn btn-sm btn-gold" onclick="App.abrirLoja('${f.id}')">${icon('mochila',14)} Adquirir Itens</button>
          ${painelEditando('inventario',f.id)? `<button class="btn btn-sm" onclick="App.fInvAdd('${f.id}')">Adicionar linha</button>`:''}
        </div></div>
        <div class="panel-body">
        ${ (f.inventario||[]).length===0? '<p class="muted" style="margin:0;font-size:13px;">Bolsa vazia.</p>' : f.inventario.map((it,i)=> painelEditando('inventario',f.id) ? `
          <div class="row" style="margin-bottom:8px;">
            <input value="${esc(it)}" style="flex:1;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fInvSet('${f.id}',${i},this.value)">
            <button class="btn btn-sm btn-danger" onclick="App.fInvDel('${f.id}',${i})">×</button>
          </div>` : `
          <div class="stat-label-ro" style="padding:5px 0;">${esc(it)||'—'}</div>`).join('') }
        </div></div>

      <div class="panel" data-accent="magic"><div class="panel-head"><h3>${lapisEditBtn('habClasse',f.id)}${icon('livro')} Habilidades de classe</h3></div><div class="panel-body">
        ${painelEditando('habClasse',f.id)
          ? `<textarea rows="10" style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);line-height:1.5;" oninput="App.fCampo('${f.id}','habilidades',this.value)">${esc(f.habilidades)}</textarea>`
          : `<div class="stat-label-ro" style="white-space:pre-wrap;line-height:1.5;">${esc(f.habilidades)||'—'}</div>`}
      </div></div>

      ${SubclassPanelHTML(f)}
      ${MulticlassePanelHTML(f)}
      ${GuiaPersonagemPanelHTML(f)}
      ${f.classe==='Druida'? BeastFormPanelHTML(f) : ''}
      ${['Assassino','Lutador','Bruxo','Bruxa'].includes(f.classe)? ClassResourcesHTML(f) : ''}
      ${f.tipo==='pc'? TransformacaoPanelHTML(f) : ''}
      ${(f.classe==='Patrulheiro' && f.subclasseId==='Treinador')? CompanionPanelHTML(f) : ''}

      ${(f.classe && ORIGENS[f.classe])? `<div class="panel" data-accent="lore">
        <div class="panel-head" style="cursor:pointer;" onclick="App.toggleOrigem()">
          <h3>${icon('pergaminho')} Origem & Vínculos</h3>
          <span class="muted" style="font-size:.9rem;">${state.origemAberto? 'recolher ▲':'expandir ▼'}</span>
        </div>
        ${state.origemAberto? `<div class="panel-body">
        <p class="muted" style="font-size:12px;margin:0 0 8px;">Pergunta de origem</p>
        <select onchange="App.fCampoNum('${f.id}','origemIdx',this.value)" style="margin-bottom:8px;">
          ${ORIGENS[f.classe].map((p,i)=>`<option value="${i}" ${Number(f.origemIdx||0)===i?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <textarea rows="3" placeholder="Sua resposta..." style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fCampo('${f.id}','origemResposta',this.value)">${esc(f.origemResposta)}</textarea>
        <p class="muted" style="font-size:12px;margin:16px 0 8px;">Vínculos — perguntas para os outros jogadores</p>
        <ul style="margin:0 0 8px;padding-left:18px;font-size:12px;color:var(--muted);">
          ${VINCULOS[f.classe].map(v=>`<li style="margin-bottom:4px;">${esc(v)}</li>`).join('')}
        </ul>
        <textarea rows="3" placeholder="Anotações sobre os vínculos do grupo..." style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);" oninput="App.fCampo('${f.id}','vinculosNotas',this.value)">${esc(f.vinculosNotas)}</textarea>
      </div>` : ''}</div>` : ''}

      <div class="panel" data-accent="lore"><div class="panel-head"><h3>${icon('pergaminho')} Anotações</h3></div><div class="panel-body">
        <textarea rows="5" style="width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--field);color:var(--parch);line-height:1.5;" oninput="App.fCampo('${f.id}','notas',this.value)">${esc(f.notas)}</textarea>
      </div></div>
    </div>
  </div>
  `;
}

function HabilidadesListHTML(f){
  const habs = f.habilidades || [];
  return `<div class="panel"><div class="panel-head"><h3>${icon('livro')} Habilidades</h3><button class="btn btn-sm btn-gold" onclick="App.habAdd('${f.id}')">${icon('mais',15)} Adicionar</button></div>
    <div class="panel-body">
      ${habs.length===0? '<p class="muted" style="margin:0;">Nenhuma habilidade ainda. Habilidades podem ser passivas, ações ou reações — e algumas exigem gastar Pontos de Medo ou de Fadiga.</p>' : habs.map(h=>`
        <div style="padding:12px 0;border-bottom:1px solid var(--line);">
          <div class="grid g4" style="margin-bottom:8px;">

function WizardHTML(){
  const w = state.wizard, f = w.ficha;
  const passos = ['Classe','Herança','Atributos','Equipamento','Origem','Experiências','Cartas de Domínio','Vínculos'];

  const doms = dominiosDaClasse(f.classe);

  const cabecalho = `<div class="row" style="margin-bottom:24px;flex-wrap:wrap;">

            <div style="font-family:var(--serif);color:var(--parch);font-size:18px;">${nome}</div>

        <div class="field"><label>Nome</label><input value="${esc(f.nome)}" oninput="App.wizCampo('nome',this.value)"></div>

        ${ATRIBUTOS.map(a=>`<div class="field"><label>${a.n}</label>
          <select onchange="App.wizAtributo('${a.k}',this.value)">
            ${[2,1,0,-1].map(v=>`<option value="${v}" ${f.atributos[a.k]===v?'selected':''}>${sgn(v)}</option>`).join('')}
          </select></div>`).join('')}

      <p style="margin:14px 0 0;font-size:13px;color:${valido?'var(--seal)':'#E39B9B'};">${valido? '✓ Distribuição válida.' : '✗ Ainda falta ajustar: use +2, +1, +1, 0, 0 e −1, cada um uma vez.'}</p>
    </div></div>`;
    podeAvancar = atributosValidos(f.atributos);

  } else if(w.passo===3){
    const partes = c? c.itens.split(/ ou /i) : [];

    const equipAbas = [
      ['fisicas','Armas Físicas'],['magicas','Armas Mágicas'],['secundarias','Secundárias'],['armaduras','Armaduras']

    const ehArmaAba = equipAba!=='armaduras';
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 5 — Escolha seu equipamento</h3></div><div class="panel-body">
      ${ c? `<div class="stack" style="font-size:14px;">
        <div class="grid g3" style="margin-bottom:4px;">
          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Arma principal</div>
            <div style="color:var(--parch);font-size:.95rem;">${f.arma1.nome? esc(f.arma1.nome) : '— nenhuma —'}</div>

          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Arma secundária</div>
            <div style="color:var(--parch);font-size:.95rem;">${f.arma2.nome? esc(f.arma2.nome) : '— nenhuma —'}</div>

          <div class="attrbox" style="text-align:left;padding:10px 12px;">
            <div class="muted" style="font-size:.78rem;">Armadura</div>

          </div>

        <p class="muted" style="font-size:.85rem;margin:0;">Escolha entre qualquer arma ou armadura de 1º patamar — não precisa ser a sugerida pela sua classe.</p>
        <div class="tabs" style="margin:4px 0 10px;">
          ${equipAbas.map(([k,n])=>`<button class="tab ${equipAba===k?'active':''}" onclick="App.wizSetEquipAba('${k}')">${n}</button>`).join('')}

        <div style="max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);">
          ${ehArmaAba
            ? equipItens.map(({it,i})=>{
                const [pat,nome,atributo,alcance,dano,empunhadura,habilidade] = it;
                return `<div style="padding:8px 0;border-bottom:1px solid var(--line);">

                    <div class="row" style="gap:6px;">
                      <button class="btn btn-sm btn-gold" onclick="App.wizEquiparArma('${categoriaKey}',${i},'arma1')">Principal</button>

                    <span style="font-size:.95rem;color:var(--parch);"><strong>${esc(nome)}</strong> <span class="muted" style="font-size:.8rem;">· limiares ${esc(limiares)} · armadura base ${base}</span></span>

          <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="radio" name="pocao" ${w.pocao==='vigor'?'checked':''} onchange="App.wizPocao('vigor')"> Poção de Vigor Menor (1d4 Fadiga)</label>

      </div>` : '<p class="muted">Escolha uma classe primeiro.</p>' }
    </div></div>`;

  } else if(w.passo===4){
    const perguntas = ORIGENS[f.classe] || [];
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 6 — Crie sua origem</h3></div><div class="panel-body">

        ${perguntas.map((p,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--parch);cursor:pointer;">

  } else if(w.passo===5){
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 7 — Crie suas Experiências</h3></div><div class="panel-body">

            <input type="checkbox" ${marcada?'checked':''} onchange="App.wizCartaToggle('${key.replace(/'/g,"\\'")}')" style="margin-top:3px;">
            <span><strong style="color:var(--parch);font-size:13px;">${esc(cd[0])}</strong> <span class="muted" style="font-size:11px;">· ${esc(cd[2])} · custo ${cd[3]}</span>
            <div class="muted" style="font-size:12px;margin-top:2px;">${esc(cd[4])}</div></span>
          </label>`;
        }).join('')}`;
      }).join('')}
    </div></div>`;
    podeAvancar = w.cartasEscolhidas.length===2;

  } else if(w.passo===7){
    const vinc = VINCULOS[f.classe] || [];
    corpo = `<div class="panel"><div class="panel-head"><h3>Passo 9 — Crie seus vínculos</h3></div><div class="panel-body">
      <p class="muted" style="margin-top:0;font-size:13px;">Vínculos são construídos com o resto do grupo à mesa. Use estas perguntas como inspiração para fazer aos outros jogadores, ou anote o que já foi combinado.</p>
      <ul style="margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--muted);">
        ${vinc.map(v=>`<li style="margin-bottom:4px;">${esc(v)}</li>`).join('')}
      </ul>
      <div class="field"><label>Anotações de vínculo</label><textarea rows="4" oninput="App.wizVinculosNotas(this.value)">${esc(f.vinculosNotas)}</textarea></div>
    </div></div>`;
  }

  const rodape = `<div class="between">
    <button class="btn btn-ghost" onclick="${w.passo===0? 'App.cancelarAssistente()' : `App.wizPasso(${w.passo-1})`}">Voltar</button>
    ${ w.passo < passos.length-1
      ? `<button class="btn btn-gold" ${!podeAvancar?'disabled':''} onclick="App.wizPasso(${w.passo+1})">Continuar</button>`
      : `<button class="btn btn-gold" onclick="App.wizFinalizar()">Criar personagem</button>` }
  </div>`;

  return `<div style="margin-bottom:20px;"><button class="btn btn-sm btn-ghost" onclick="App.cancelarAssistente()">← Cancelar</button></div>${cabecalho}${corpo}${rodape}`;
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function init(){
  if(!firebaseConfigurado()){
    state.screen = 'config-firebase';
    render();
    return;
  }
  render(); // mostra a tela de login enquanto o Firebase resolve a sessão salva
  authFB.onAuthStateChanged(async (user)=>{
    if(user){
      const nomeExibicao = user.displayName || user.email;
      const u = await DB.get(K.user(nomeExibicao));
      state.usuario = u || {nome:nomeExibicao, uid:user.uid, email:user.email, criado:Date.now(), campanhas:[]};
      if(state.screen==='login') state.screen='home';
      if(state.screen==='home') await recarregarCampanhasHome();
    } else {
      state.usuario = null;
      if(state.screen!=='config-firebase') state.screen = 'login';
    }
    render();
  });
})();
</script>

</html>
